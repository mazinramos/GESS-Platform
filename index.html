                                    {lang === 'ar' ? 'حذف الحساب نهائيًا' : 'Permanently delete account'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function StudentsAdminPanel({ lang, darkMode, isSuperAdmin, currentUid }) {
            const [students, setStudents] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [yearFilter, setYearFilter] = React.useState('all');
            const [statusFilter, setStatusFilter] = React.useState('all');
            const [search, setSearch] = React.useState('');
            const [selectedStudent, setSelectedStudent] = React.useState(null);
            const [printStudent, setPrintStudent] = React.useState(null);
            const [printTableMode, setPrintTableMode] = React.useState(false);

            // نسجّل هنا "طريقة إقفال" النافذة الحالية عشان زرار الرجوع (فوق في مستوى التطبيق)
            // يقفل النافذة الفرعية دي الأول، بدل ما يطلع من لوحة الأدمن كلها على طول
            React.useEffect(() => {
                if (selectedStudent) {
                    window.gessCloseOverlay = () => setSelectedStudent(null);
                }
                return () => { window.gessCloseOverlay = null; };
            }, [selectedStudent]);

            const loadStudents = React.useCallback(() => {
                setLoading(true);
                db.collection('users').get().then(snapshot => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => (a.fullName || '').localeCompare(b.fullName || '', undefined, { numeric: true }));
                    setStudents(data);
                }).catch(err => {
                    console.error('Students fetch error:', err);
                }).finally(() => setLoading(false));
            }, []);

            React.useEffect(() => { loadStudents(); }, [loadStudents]);


            const toggleStatus = async (student) => {
                const newStatus = student.status === 'suspended' ? 'active' : 'suspended';
                try {
                    await db.collection('users').doc(student.id).update({ status: newStatus });
                    setStudents(prev => prev.map(s => s.id === student.id ? { ...s, status: newStatus } : s));
                    setSelectedStudent(prev => prev && prev.id === student.id ? { ...prev, status: newStatus } : prev);
                } catch (err) {
                    console.error('Status update error:', err);
                    alert(lang === 'ar' ? '⚠️ تعذر تحديث الحالة' : '⚠️ Could not update status');
                }
            };

            // منح/سحب صلاحية الأدمن - للسوبر أدمن فقط
            const toggleRole = async (student) => {
                if (!isSuperAdmin) return;
                const newRole = student.role === 'admin' ? 'student' : 'admin';
                if (!window.confirm(
                    newRole === 'admin'
                        ? (lang === 'ar' ? `تأكيد: منح "${student.fullName}" صلاحية أدمن كامل الوصول؟` : `Confirm: grant "${student.fullName}" full admin access?`)
                        : (lang === 'ar' ? `تأكيد: سحب صلاحية الأدمن من "${student.fullName}"؟` : `Confirm: revoke admin access from "${student.fullName}"?`)
                )) return;
                try {
                    await db.collection('users').doc(student.id).update({ role: newRole });
                    setStudents(prev => prev.map(s => s.id === student.id ? { ...s, role: newRole } : s));
                    setSelectedStudent(prev => prev && prev.id === student.id ? { ...prev, role: newRole } : prev);
                } catch (err) {
                    console.error('Role update error:', err);
                    alert(lang === 'ar' ? '⚠️ تعذر تحديث الصلاحية' : '⚠️ Could not update role');
                }
            };

            // حذف حساب طالب نهائيًا من القائمة - للسوبر أدمن فقط، لأنه إجراء لا يمكن التراجع عنه
            // (مفيد لو لقيت حساب وهمي، أو حساب مش تابع للدفعة، أو حساب مكرر)
            const handleDeleteStudent = async (student) => {
                if (!isSuperAdmin) return;
                const confirmText = lang === 'ar'
                    ? `هتحذف حساب "${student.fullName || student.email}" نهائيًا ومش هترجع تقدر تسترجعه.\n\nاكتب "حذف" بالظبط للتأكيد:`
                    : `You're about to permanently delete "${student.fullName || student.email}". This cannot be undone.\n\nType "delete" exactly to confirm:`;
                const typed = window.prompt(confirmText);
                const expected = lang === 'ar' ? 'حذف' : 'delete';
                if (!typed || typed.trim() !== expected) {
                    if (typed !== null) alert(lang === 'ar' ? 'الحذف اتلغى - النص المكتوب مش مطابق' : 'Deletion cancelled - text did not match');
                    return;
                }
                try {
                    await db.collection('users').doc(student.id).delete();
                    setStudents(prev => prev.filter(s => s.id !== student.id));
                    setSelectedStudent(null);
                    alert(lang === 'ar' ? '🗑️ تم حذف الحساب نهائيًا' : '🗑️ Account permanently deleted');
                } catch (err) {
                    console.error('Delete student error:', err);
                    alert(lang === 'ar' ? '⚠️ تعذر حذف الحساب' : '⚠️ Could not delete account');
                }
            };

            const filtered = students.filter(s => {
                if (yearFilter !== 'all' && String(s.year) !== yearFilter) return false;
                if (statusFilter !== 'all' && (s.status || 'active') !== statusFilter) return false;
                if (search.trim()) {
                    const q = search.trim().toLowerCase();
                    const hay = [s.fullName, s.email, s.studentId, s.specialization, batchLabelForYear(s.year)].filter(Boolean).join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            const counts = [1, 2, 3, 4, 5].map(y => students.filter(s => String(s.year) === String(y)).length);

            const isPrintPreviewOpen = !!(printStudent || printTableMode);

            // إغلاق معاينة الطباعة تلقائيًا بعد إتمام الطباعة أو إلغائها من نافذة المتصفح
            React.useEffect(() => {
                const handleAfterPrint = () => { setPrintStudent(null); setPrintTableMode(false); };
                window.addEventListener('afterprint', handleAfterPrint);
                return () => window.removeEventListener('afterprint', handleAfterPrint);
            }, []);

            // نسجّل هنا "طريقة إقفال" معاينة الطباعة عشان زرار الرجوع يقفلها هي الأول
            React.useEffect(() => {
                if (isPrintPreviewOpen) {
                    window.gessCloseOverlay = () => { setPrintStudent(null); setPrintTableMode(false); };
                    return () => { window.gessCloseOverlay = null; };
                }
            }, [isPrintPreviewOpen]);

                    return (a.title || "").localeCompare((b.title || ""), undefined, { numeric: true });
                });

                    setContents(sorted);
                    try {
                        localStorage.setItem(MATERIALS_CACHE_KEY, JSON.stringify({ data: sorted, ts: Date.now() }));
                    } catch (e) { /* تجاهل لو الكاش ممتلئ */ }
                    return sorted;

                            usedCache = true;

          const addMaterial = async (e) => {
  e.preventDefault();
 
  const form = e.target;

  // ====== مجلة ======
  if (adminAddMode === 'magazine') {
    const magTitle = form.magTitle?.value?.trim();
    const magCover = form.magCover?.value?.trim();
    const magUrl = form.magUrl?.value?.trim();
    const magDescription = form.magDescription?.value?.trim() || "";
    const magTargetBatch = form.magTargetBatch?.value?.trim() || "";
    if (!magTitle || !magCover || !magUrl) {
      alert(lang === 'ar' ? "الرجاء تعبئة اسم المجلة، رابط الغلاف، ورابط المجلة" : "Please fill title, cover, and link");
      return;
    }
    try {
      await db.collection("materials").add({
        category: 'magazine',
        type: 'magazine',
        title: magTitle,
        coverUrl: magCover,
        url: magUrl,
        description: magDescription,
        targetBatch: magTargetBatch,
        createdAt: new Date()
      });
      alert("✅ تم رفع المجلة بنجاح - " + magTitle);
      if (window.gessRefreshMaterials) window.gessRefreshMaterials();
      form.reset();
    } catch (error) {
      console.error("Firebase Error:", error);
      alert("فشل الرفع: " + error.message);
    }
    return;
  }
 
 
  const subjectName = modalSubjectData ? modalSubjectData.subject : (customSubject || form.subject?.value || "عام");
 
 
  const urlValue = form.url?.value;
  const typeValue = form.type?.value || "pdf";
  const materialTitle = form.materialTitle?.value?.trim();
 
  if (!urlValue) {
    alert("يا هندسة، الرابط وين؟ لازم تضع الرابط أولاً");
    return;
  }
  if (!materialTitle) {
    alert(lang === 'ar' ? "لازم تكتب اسم/عنوان للدرس أو المحتوى" : "Please enter a title for this lesson/content");
    return;
  }
 
 
  const data = {
    subject: subjectName,
    courseName: adminAddMode === 'special_course' ? subjectName : null,
    title: materialTitle,
    type: typeValue,
    // موحّدة دلوقتي مع نفس شكل البيانات اللي بيستخدمه نظام "إضافة درس لمادة موجودة"
    // (بدل ما يكون فيه شكلين مختلفين للبيانات). المحتوى القديم لسه شغال زي ما هو
    // لأن شاشة العرض بتدعم الشكلين مع بعض.
    links: [{ type: typeValue, title: materialTitle, url: urlValue }],
    yearId: modalSubjectData ? String(modalSubjectData.yearId) : (form.yearId?.value || null),
    semesterId: modalSubjectData ? String(modalSubjectData.semesterId) : (form.semesterId?.value || null),
    category: adminAddMode || 'academic',
    createdAt: new Date()
  };
 
  try {
   
    await db.collection("materials").add(data); 
    if (window.gessRefreshMaterials) window.gessRefreshMaterials();
 
    alert("✅ تم الرفع بنجاح - " + subjectName);
 
  
    form.reset();
    setCustomSubject('');
    if(typeof setIsModalOpen === 'function') setIsModalOpen(false);
 
  } catch (error) {
    console.error("Firebase Error:", error);
    alert("فشل الرفع: " + error.message);
  }
};

let swiperInstance = null;
let currentEditingId = null;
 
function initSwiperSafely() {
    if (typeof Swiper === 'undefined') {
        setTimeout(initSwiperSafely, 200);
        return;
    }
    if (swiperInstance) {
        swiperInstance.destroy(true, true);
    }
    swiperInstance = new Swiper('.mySwiper', {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: false,
        grabCursor: true,
        autoplay: {
            delay: 6000,
            disableOnInteraction: true,
            pauseOnMouseEnter: true,
        },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    });
}
 
// ============================================================
// الإعلانات (announcements) — تحويل من onSnapshot (اتصال حي دائم)
// إلى جلب لمرة واحدة عند تحميل الصفحة + إعادة جلب فقط بعد أي عملية
// نشر/تعديل/حذف/تفعيل من الأدمن نفسه. الإشعارات الفورية بترسل أصلاً
// عبر OneSignal Push، فمفيش داعي لاتصال حي مستمر يستهلك القراءات.
function fetchAndRenderAnnouncements() {
    if (typeof db === 'undefined') return;
    db.collection('announcements').get().then(function(snapshot) {
        const now = Date.now();
        let studentListHtml = '';
        let adminTableHtml = '';
        let activeCount = 0;

        snapshot.forEach(function(doc) {
            const item = doc.data();
            const itemId = doc.id;
            
            const isExpired = now > item.expiresAt;
            const isShowingNow = item.isActive && !isExpired;
            const createdMs = typeof item.createdAt === 'number' ? item.createdAt : (item.createdAt && item.createdAt.toMillis ? item.createdAt.toMillis() : 0);
            const isNew = createdMs && (now - createdMs) < (48 * 60 * 60 * 1000);
 
            if (isShowingNow) {
                activeCount++;
                studentListHtml += `
                    <div class="swiper-slide">
                        <div class="relative overflow-hidden mx-1 mb-1 rounded-3xl border transition-colors duration-300 bg-white dark:bg-gray-800/80 border-orange-100 dark:border-gray-700 shadow-sm">
                            <div class="absolute top-0 bottom-0 right-0 w-1.5 bg-gradient-to-b from-[#f58220] to-[#ff9d4d]"></div>
                            <div class="p-5 pr-6 flex items-start gap-3">
                                <div class="w-10 h-10 shrink-0 rounded-2xl bg-orange-100 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center mt-0.5">
                                    <i data-lucide="megaphone" class="w-5 h-5"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <h4 class="font-black text-[15px] text-gray-900 dark:text-white truncate">${item.title}</h4>
                                        ${isNew ? '<span class="shrink-0 text-[9px] font-black text-white bg-gradient-to-r from-red-500 to-orange-500 px-2 py-0.5 rounded-full">' + (typeof lang !== 'undefined' && lang === 'ar' ? 'جديد' : 'NEW') + '</span>' : ''}
                                    </div>
                                    <p class="text-[13px] leading-relaxed text-gray-500 dark:text-gray-300">${item.content}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
 
            adminTableHtml += `
                <tr style="border-bottom: 1px solid #f3f4f6; font-size: 13px; text-align: right;">
                    <td style="padding: 14px; font-weight: bold;">
                        <div style="color: #1f2937;">${item.title}</div>
                        <div style="font-size: 11px; color: #9ca3af; font-weight: normal; margin-top: 2px;">${item.content}</div>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <span style="padding: 3px 10px; border-radius: 9999px; font-size: 10px; font-weight: bold; ${isShowingNow ? 'background-color: #d1fae5; color: #065f46;' : 'background-color: #fee2e2; color: #991b1b;'}">
                            ${isShowingNow ? 'نشط' : 'مخفي/منتهي'}
                        </span>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <div style="display: flex; gap: 6px; justify-content: center; align-items: center;">
                            <button type="button" onclick="db.collection('announcements').doc('${itemId}').update({isActive: ${!item.isActive}}).then(function(){ if(window.gessRefreshAnnouncements) window.gessRefreshAnnouncements(); })" style="padding: 6px 10px; border: none; background: #e5e7eb; cursor: pointer; border-radius: 8px; font-size: 12px;">👁️</button>
                            <button type="button" onclick="prepareAnnouncementForEdit('${itemId}', '${item.title.replace(/'/g, "\\'")}', '${item.content.replace(/'/g, "\\'")}')" style="padding: 6px 10px; border: none; background: #feebc8; color: #c05621; cursor: pointer; border-radius: 8px; font-size: 12px; font-weight: bold;">📝</button>
                            <button type="button" onclick="if(confirm('حذف؟')){db.collection('announcements').doc('${itemId}').delete().then(function(){ if(window.gessRefreshAnnouncements) window.gessRefreshAnnouncements(); })}" style="padding: 6px 10px; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; border-radius: 8px; font-size: 12px;">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }); 
 
        function tryInjectingAdminTable() {
            const aTable = document.getElementById('admin-table-body');
            if (aTable) {
                aTable.innerHTML = adminTableHtml || '<tr><td colspan="3" style="text-align: center; padding: 20px; color: #9ca3af; font-size: 12px;">لا توجد سجلات.</td></tr>';
            } else {
                setTimeout(tryInjectingAdminTable, 500);
            }
        }
 
        // إظهار/إخفاء الكارت بالكامل حسب وجود إعلانات نشطة — بدون ما ياخد مساحة من غير داعي
        const wrapper = document.getElementById('announcements-wrapper');
        if (wrapper) {
            wrapper.style.display = activeCount > 0 ? '' : 'none';
        }

        const countBadge = document.getElementById('announcements-count-badge');
        if (countBadge) {
            const arLabel = activeCount + ' نشط';
            const enLabel = activeCount + ' active';
            countBadge.textContent = (typeof lang !== 'undefined' && lang === 'ar') ? arLabel : enLabel;
        }

        const aList = document.getElementById('announcements-list');
        if (aList && activeCount > 0) {
            aList.innerHTML = studentListHtml;
            if (typeof initSwiperSafely === 'function') initSwiperSafely();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        
        tryInjectingAdminTable();
    }).catch(function(err) {
        console.error('Announcements fetch error:', err);
    });
}

window.gessRefreshAnnouncements = fetchAndRenderAnnouncements;

if (typeof db !== 'undefined') {
    fetchAndRenderAnnouncements(); // جلب لمرة واحدة عند تحميل الصفحة
}
 
window.prepareAnnouncementForEdit = function prepareAnnouncementForEdit(id, title, content) {
    currentEditingId = id; 
    
    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const submitBtn = document.getElementById('submit-btn');
    
    if (titleField && contentField) {
        titleField.value = title;
        contentField.value = content;
        titleField.focus(); 
        
        if (submitBtn) {
            submitBtn.innerHTML = "تحديث وحفظ التعديلات 💾";
            submitBtn.style.backgroundColor = "#d69e2e"; 
        }
    }
}
 
 
async function sendPushNotification(title, message) {
    try {
        const response = await fetch("https://gess-notifications.mazenramos0.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                message: message,
                url: window.location.origin
            })
        });

        const result = await response.json();

        if (result.success) {
            console.log("✅ الإشعار أُرسل بنجاح لـ", result.recipients, "مشترك");
        } else {
            console.warn("⚠️ OneSignal response:", result);
        }

        return result;
    } catch (e) {
        console.error("❌ خطأ في إرسال الإشعار:", e);
        return null;
    }
}

window.handlePublishAnnouncement = async function handlePublishAnnouncement() {
    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const durationField = document.getElementById('form-duration');
    const submitBtn = document.getElementById('submit-btn');

    if (!titleField || !contentField || !titleField.value || !contentField.value) {
        alert("⚠️ الرجاء ملء جميع الحقول أولاً!");
        return;
    }

    const title = titleField.value;
    const content = contentField.value;
    const durationDays = parseInt(durationField.value || 7);
    const expiresTimestamp = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

    // تعطيل الزر أثناء الإرسال
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "⏳ جاري النشر والإرسال...";
    }

    if (typeof db !== 'undefined') {
        if (currentEditingId) {
            // ── تعديل إعلان موجود ──
            db.collection('announcements').doc(currentEditingId).update({
                title: title,
                content: content,
                expiresAt: expiresTimestamp
            }).then(async function() {
                // ✅ إرسال الإشعار بعد التعديل
                await sendPushNotification(title, content);
                if (window.gessRefreshAnnouncements) window.gessRefreshAnnouncements();
                alert("🚀 تم تحديث الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("خطأ أثناء التعديل:", error);
                alert("❌ حدث خطأ أثناء التعديل: " + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "تحديث وحفظ التعديلات 💾";
                }
            });
        } else {
            // ── نشر إعلان جديد ──
            db.collection('announcements').add({
                title: title,
                content: content,
                createdAt: Date.now(),
                expiresAt: expiresTimestamp,
                isActive: true
            }).then(async function() {
                // ✅ إرسال الإشعار بعد الحفظ — كان مفقوداً هنا!
                await sendPushNotification(title, content);
                if (window.gessRefreshAnnouncements) window.gessRefreshAnnouncements();
                alert("🚀 تم نشر الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("حدث خطأ أثناء الحفظ:", error);
                alert("❌ حدث خطأ أثناء الحفظ: " + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "نشر الإعلان وإرسال إشعار 🚀";
                }
            });
        }
    }
}
 
window.resetFormState = function resetFormState() {
    currentEditingId = null;
    document.getElementById('form-title').value = '';
    document.getElementById('form-content').value = '';
    
    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
        submitBtn.disabled = false;                              // ← إعادة تفعيل الزر
        submitBtn.innerHTML = "نشر الإعلان وإرسال إشعار 🚀";
        submitBtn.style.backgroundColor = "";
    }
}

        // التأكد أولاً من أن التطبيق يعمل داخل Capacitor وأن إضافة Status Bar موجودة
if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
    const StatusBar = window.Capacitor.Plugins.StatusBar;

    const updateStatusBar = async () => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        try {
            if (prefersDark) {
                // استخدام النص 'DARK' بدلاً من الكائن Style
                await StatusBar.setStyle({ style: 'DARK' });
            } else {
                // استخدام النص 'LIGHT'
                await StatusBar.setStyle({ style: 'LIGHT' });
            }
        } catch (error) {
            console.log('Status Bar error:', error);
        }
    };

    // تشغيل الوظيفة عند فتح التطبيق
    updateStatusBar();

    // الاستماع لتغيير الوضع
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateStatusBar);
}
 
 
 
    </script>
 
 
 
    <script>
        // تسجيل الـ Service Worker - ضروري عشان التطبيق يشتغل صح كـ PWA (تثبيت + وضع standalone)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
