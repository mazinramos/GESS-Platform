                            {}
                            <button
                                type="button"
                                onClick={() => {
                                    window.open(link.url, '_blank');
                                }}
                                className="px-3 py-2 rounded-xl bg-blue-500 hover:bg-blue-600 text-white text-[10px] font-black"
                            >
                                {lang === 'ar' ? "معاينة" : "Preview"}
                            </button>

                            {}
                            <button
                                type="button"
                                onClick={() => {
                                    setLinksList(
                                        linksList.filter((_, i) => i!== idx)
                                    );
                                }}
                                className="px-3 py-2 rounded-xl bg-red-500 hover:bg-red-600 text-white text-[10px] font-black"
                            >
                                {lang === 'ar' ? "حذف" : "Delete"}
                            </button>

                        </div>
                    </div>

                    {/* Preview */}
                    {(isVideo || isVoice) && (
                        <div className="border-t">

                            {isVideo && (
                                <div className="aspect-video bg-black">

                                    <iframe
                                        src={previewUrl}
                                        className="w-full h-full border-none"
                                        allowFullScreen
                                    ></iframe>

                                </div>
                            )}

                            {isVoice && (
                                <div className="p-4">

                                    <audio
                                        controls
                                        className="w-full"
                                        src={link.url}
                                    />

                                </div>
                            )}

                        </div>
                    )}

                </div>
            );
        })}
    </div>
)}
            </div>
        </div>
    )}

    <div className="sticky bottom-0 pt-2 bg-white dark:bg-gray-900 z-10">
        <button type="submit" className="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-xl text-base shadow-lg transition-all">
            {isExistingLecture
                ? (lang === 'ar' ? "تحديث وحفظ الروابط في الدرس الحالي" : "Update Existing Lecture")
                : (lang === 'ar' ? "حفظ ونشر كـ درس جديد مجمع" : "Save as New Lecture")
            }
        </button>
    </div>
</form>

<div className="mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
    <h3 className={`text-lg font-black mb-4 ${darkMode ? 'text-orange-400' : 'text-gray-700'}`}>
        {lang === 'ar' ? "الدروس المضافة حالياً:": "Current Lectures:"}
    </h3>

    <div className="space-y-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar">
        {contents
            .filter(c =>
                c.subject === modalSubjectData.subject &&
                String(c.yearId) === String(modalSubjectData.yearId) &&
                String(c.semesterId) === String(modalSubjectData.semesterId)
            )
            .sort((a, b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()))
            .map((lecture, index) => (
                <div key={lecture.id || index} className={`p-4 rounded-2xl flex justify-between items-center border transition-all ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-gray-50 border-gray-100 hover:bg-white hover:shadow-md'}`}>
                    <div className="flex flex-col">
                        <span className={`font-bold text-sm ${darkMode ? 'text-white' : 'text-gray-800'}`}>{lecture.title}</span>
                        <span className="text-[10px] text-orange-500 font-bold uppercase">{lecture.type}</span>
                    </div>

                    <div className="flex gap-2">
                              <button
                            onClick={() => handleEditLecture(lecture)}
                            className="p-2 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-600 hover:text-white transition-colors"
                            title="تعديل"
                        >
                            <i data-lucide="edit-3" className="w-4 h-4"></i>
                            <span className="text-[10px] ml-1">تعديل</span>
                        </button>

                        {}
                        <button
                            onClick={() => handleDelete("materials", lecture.id)}
                            className="p-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-600 hover:text-white transition-colors"
                            title="حذف"
                        >
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                            <span className="text-[10px] ml-1">حذف</span>
                        </button>

                        {}
                        <a
                            href={lecture.links?.[0]?.url || lecture.url || '#'}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="p-2 bg-gray-200 text-gray-600 rounded-xl hover:bg-gray-300 transition-colors"
                        >
                            <i data-lucide="external-link" className="w-4 h-4"></i>
                        </a>
                    </div>
                </div>
            ))
        }

        {contents.filter(c => c.subject === modalSubjectData.subject).length === 0 && (
            <p className="text-center py-4 text-gray-400 text-sm italic">
                {lang === 'ar' ? "لا توجد دروس مضافة لهذه المادة بعد" : "No lectures added for this subject yet"}
            </p>
        )}
    </div>
</div>

        </div>
    </div>
)}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        // Init Swiper after React has rendered
        setTimeout(function() { if (typeof initSwiperSafely === 'function') initSwiperSafely(); }, 500);
// =========================================================================
let swiperInstance = null;
let currentEditingId = null;

function initSwiperSafely() {
    if (typeof Swiper === 'undefined') {
        setTimeout(initSwiperSafely, 200);
        return;
    }
    if (swiperInstance) {
        swiperInstance.destroy(true, true);
    }
    swiperInstance = new Swiper('.mySwiper', {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: false,
        grabCursor: true,
        autoplay: {
            delay: 6000,
            disableOnInteraction: true,
            pauseOnMouseEnter: true,
        },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    });
}

// ============================================================

function fetchAndRenderAnnouncements() {
    if (typeof db === 'undefined') return;
    db.collection('announcements').get().then(function(snapshot) {
        const now = Date.now();
        let studentListHtml = '';
        let adminTableHtml = '';
        let activeCount = 0;

        snapshot.forEach(function(doc) {
            const item = doc.data();
            const itemId = doc.id;

            const isExpired = now > item.expiresAt;
            const isShowingNow = item.isActive &&!isExpired;
            const createdMs = typeof item.createdAt === 'number' ? item.createdAt : (item.createdAt && item.createdAt.toMillis ? item.createdAt.toMillis() : 0);
            const isNew = createdMs && (now - createdMs) < (48 * 60 * 60 * 1000);

            if (isShowingNow) {
                activeCount++;
                studentListHtml += `
                    <div class="swiper-slide">
                        <div class="relative overflow-hidden mx-1 mb-1 rounded-3xl border transition-colors duration-300 bg-white dark:bg-gray-800/80 border-orange-100 dark:border-gray-700 shadow-sm">
                            <div class="absolute top-0 bottom-0 right-0 w-1.5 bg-gradient-to-b from-[#f58220] to-[#ff9d4d]"></div>
                            <div class="p-5 pr-6 flex items-start gap-3">
                                <div class="w-10 h-10 shrink-0 rounded-2xl bg-orange-100 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center mt-0.5">
                                    <i data-lucide="megaphone" class="w-5 h-5"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-2 mb-1">
                                        <h4 class="font-black text-[15px] text-gray-900 dark:text-white truncate">${item.title}</h4>
                                        ${isNew ? '<span class="shrink-0 text-[9px] font-black text-white bg-gradient-to-r from-red-500 to-orange-500 px-2 py-0.5 rounded-full">' + (typeof lang!== 'undefined' && lang === 'ar' ? 'جديد' : 'NEW') + '</span>' : ''}
                                    </div>
                                    <p class="text-[13px] leading-relaxed text-gray-500 dark:text-gray-300">${item.content}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            adminTableHtml += `
                <tr style="border-bottom: 1px solid #f3f4f6; font-size: 13px; text-align: right;">
                    <td style="padding: 14px; font-weight: bold;">
                        <div style="color: #1f2937;">${item.title}</div>
                        <div style="font-size: 11px; color: #9ca3af; font-weight: normal; margin-top: 2px;">${item.content}</div>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <span style="padding: 3px 10px; border-radius: 9999px; font-size: 10px; font-weight: bold; ${isShowingNow ? 'background-color: #d1fae5; color: #065f46;' : 'background-color: #fee2e2; color: #991b1b;'}">
                            ${isShowingNow ? 'نشط' : 'مخفي/منتهي'}
                        </span>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <div style="display: flex; gap: 6px; justify-content: center; align-items: center;">
                            <button type="button" title="${isShowingNow ? 'إخفاء' : 'إظهار'}" onclick="db.collection('announcements').doc('${itemId}').update({isActive: ${!item.isActive}}).then(function(){ if(window.gessRefreshAnnouncements) window.gessRefreshAnnouncements(); })" style="padding: 6px 10px; border: none; background: #e5e7eb; color: #374151; cursor: pointer; border-radius: 8px; font-size: 12px; display: flex; align-items: center; justify-content: center;"><i data-lucide="${isShowingNow ? 'eye-off' : 'eye'}" style="width: 14px; height: 14px;"></i></button>
                            <button type="button" title="تعديل" onclick="prepareAnnouncementForEdit('${itemId}', '${item.title.replace(/'/g, "\\'")}', '${item.content.replace(/'/g, "\\'")}')" style="padding: 6px 10px; border: none; background: #feebc8; color: #c05621; cursor: pointer; border-radius: 8px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;"><i data-lucide="pencil" style="width: 14px; height: 14px;"></i></button>
                            <button type="button" title="حذف" onclick="if(confirm('حذف؟')){db.collection('announcements').doc('${itemId}').delete().then(function(){ if(window.gessRefreshAnnouncements) window.gessRefreshAnnouncements(); })}" style="padding: 6px 10px; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; border-radius: 8px; font-size: 12px; display: flex; align-items: center; justify-content: center;"><i data-lucide="trash-2" style="width: 14px; height: 14px;"></i></button>
                        </div>
                    </td>
                </tr>
            `;
        });

        function tryInjectingAdminTable() {
            const aTable = document.getElementById('admin-table-body');
            if (aTable) {
                aTable.innerHTML = adminTableHtml || '<tr><td colspan="3" style="text-align: center; padding: 20px; color: #9ca3af; font-size: 12px;">لا توجد سجلات.</td></tr>';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            } else {
                setTimeout(tryInjectingAdminTable, 500);
            }
        }

        const wrapper = document.getElementById('announcements-wrapper');
        if (wrapper) {
            wrapper.style.display = activeCount > 0 ? '' : 'none';
        }

        const countBadge = document.getElementById('announcements-count-badge');
        if (countBadge) {
            const arLabel = activeCount + ' نشط';
            const enLabel = activeCount + ' active';
            countBadge.textContent = (typeof lang!== 'undefined' && lang === 'ar') ? arLabel : enLabel;
        }

        const aList = document.getElementById('announcements-list');
        if (aList && activeCount > 0) {
            aList.innerHTML = studentListHtml;
            if (typeof initSwiperSafely === 'function') initSwiperSafely();
            if (typeof lucide!== 'undefined') lucide.createIcons();
        }

        tryInjectingAdminTable();
    }).catch(function(err) {
        console.error('Announcements fetch error:', err);
    });
}

window.gessRefreshAnnouncements = fetchAndRenderAnnouncements;

if (typeof db!== 'undefined') {
    fetchAndRenderAnnouncements();
}

window.prepareAnnouncementForEdit = function prepareAnnouncementForEdit(id, title, content) {
    currentEditingId = id;

    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const submitBtn = document.getElementById('submit-btn');

    if (titleField && contentField) {
        titleField.value = title;
        contentField.value = content;
        titleField.focus();

        if (submitBtn) {
            submitBtn.innerHTML = "تحديث وحفظ التعديلات";
            submitBtn.style.backgroundColor = "#d69e2e";
        }
    }
}

async function sendPushNotification(title, message) {
    try {
        const response = await fetch("https://gess-notifications.mazenramos0.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                message: message,
                url: window.location.origin
            })
        });

        const result = await response.json();

        if (result.success) {
            console.log("الإشعار أُرسل بنجاح لـ", result.recipients, "مشترك");
        } else {
            console.warn("OneSignal response:", result);
        }

        return result;
    } catch (e) {
        console.error("خطأ في إرسال الإشعار:", e);
        return null;
    }
}

window.handlePublishAnnouncement = async function handlePublishAnnouncement() {
    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const durationField = document.getElementById('form-duration');
    const submitBtn = document.getElementById('submit-btn');

    if (!titleField ||!contentField ||!titleField.value ||!contentField.value) {
        alert(" الرجاء ملء جميع الحقول أولاً!");
        return;
    }

    const title = titleField.value;
    const content = contentField.value;
    const durationDays = parseInt(durationField.value || 7);
    const expiresTimestamp = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "جاري النشر والإرسال...";
    }

    if (typeof db!== 'undefined') {
        if (currentEditingId) {

            db.collection('announcements').doc(currentEditingId).update({
                title: title,
                content: content,
                expiresAt: expiresTimestamp
            }).then(async function() {

                await sendPushNotification(title, content);
                if (window.gessRefreshAnnouncements) window.gessRefreshAnnouncements();
                alert(" تم تحديث الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("خطأ أثناء التعديل:", error);
                alert(" حدث خطأ أثناء التعديل: "+ error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "تحديث وحفظ التعديلات";
                }
            });
        } else {

            db.collection('announcements').add({
                title: title,
                content: content,
                createdAt: Date.now(),
                expiresAt: expiresTimestamp,
                isActive: true
            }).then(async function() {

                await sendPushNotification(title, content);
                if (window.gessRefreshAnnouncements) window.gessRefreshAnnouncements();
                alert(" تم نشر الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("حدث خطأ أثناء الحفظ:", error);
                alert(" حدث خطأ أثناء الحفظ: "+ error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "نشر الإعلان وإرسال إشعار";
                }
            });
        }
    }
}

window.resetFormState = function resetFormState() {
    currentEditingId = null;
    document.getElementById('form-title').value = '';
    document.getElementById('form-content').value = '';

    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "نشر الإعلان وإرسال إشعار";
        submitBtn.style.backgroundColor = "";
    }
}

if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
    const StatusBar = window.Capacitor.Plugins.StatusBar;

    const updateStatusBar = async () => {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        try {
            if (prefersDark) {

                await StatusBar.setStyle({ style: 'DARK' });
            } else {

                await StatusBar.setStyle({ style: 'LIGHT' });
            }
        } catch (error) {
            console.log('Status Bar error:', error);
        }
    };

    updateStatusBar();

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateStatusBar);
}

    </script>
