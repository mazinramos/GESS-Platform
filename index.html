        function driveImageDirectUrl(url) {
            if (!url) return url;
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/) || url.match(/id=([a-zA-Z0-9-_]+)/);
                if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
            }
            return url;
        }

        // يحوّل createdAt (سواء Firestore Timestamp أو تاريخ عادي) لعدد ميلي ثانية للمقارنة
        function toMillis(createdAt) {
            if (!createdAt) return 0;
            const date = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
            const ms = date.getTime();
            return isNaN(ms) ? 0 : ms;
        }

        // بيرجع id آخر مجلة تمت إضافتها (الأحدث بتاريخ createdAt) عشان نعرض شارة "جديد" عليها بس
        function getLatestMagazineId(magazinesList) {
            if (!magazinesList || magazinesList.length === 0) return null;
            let latest = magazinesList[0];
            for (const m of magazinesList) {
                if (toMillis(m.createdAt) > toMillis(latest.createdAt)) latest = m;
            }
            return latest.id;
        }

        function AIChatPanel({ lang, darkMode }) {
            const [messages, setMessages] = React.useState([
                { role: 'assistant', content: lang === 'ar'
                    ? 'أهلاً! أنا المساعد الذكي لمنصة GESS EDU. اسألني عن أي مادة أو موضوع هندسي 👋'
                    : 'Hi! I am the GESS EDU AI Assistant. Ask me anything 👋' }
            ]);
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const scrollRef = React.useRef(null);

            React.useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages, loading]);

            // 👇 غيّر الرابط دا برابط الـ Cloudflare Worker بتاعك بعد نشره (شوف الدليل المرفق)
            const AI_WORKER_URL = "https://gess-ai-chat.YOUR-SUBDOMAIN.workers.dev";

            const sendMessage = async () => {
                const text = input.trim();
                if (!text || loading) return;
                const newMessages = [...messages, { role: 'user', content: text }];
                setMessages(newMessages);
                setInput('');
                setLoading(true);
                try {
                    const res = await fetch(AI_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: newMessages })
                    });
                    const data = await res.json();
                    setMessages([...newMessages, { role: 'assistant', content: data.reply || (lang === 'ar' ? 'تعذر الحصول على رد الآن.' : 'Could not get a reply.') }]);
                } catch (err) {
                    setMessages([...newMessages, { role: 'assistant', content: lang === 'ar' ? '⚠️ تعذر الاتصال بالمساعد الذكي. تأكد من ربط رابط الـ Worker.' : '⚠️ Could not reach the AI assistant.' }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-2xl mx-auto animate-in fade-in duration-500">
                    <div className="text-center mb-6">
                        <div className="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-orange-100 text-orange-600 font-black text-sm mb-4">

                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-4">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-start' : 'justify-end'}`}>
                                    <div className={`max-w-[80%] px-4 py-3 rounded-2xl text-sm font-medium leading-relaxed ${
                                        m.role === 'user'
                                            ? (darkMode ? 'bg-gray-800 text-white rounded-tl-sm' : 'bg-gray-100 text-gray-800 rounded-tl-sm')
                                            : 'bg-[#f58220] text-white rounded-tr-sm'
                                    }`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-end">
                                    <div className="px-4 py-3 rounded-2xl bg-[#f58220]/70 text-white text-sm font-bold animate-pulse">
                                        {lang === 'ar' ? 'يكتب...' : 'Typing...'}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className={`p-3 border-t flex gap-2 ${darkMode ? 'border-gray-800' : 'border-gray-100'}`}>
                            <input
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') sendMessage(); }}
                                placeholder={lang === 'ar' ? 'اكتب سؤالك هنا...' : 'Type your question...'}
                                className={`flex-1 p-3 rounded-xl border-2 outline-none text-sm ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                            />

                                {lang === 'ar' ? 'إرسال' : 'Send'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

          const addMaterial = async (e) => {
  e.preventDefault();
 
  const form = e.target;

  // ====== مجلة ======
  if (adminAddMode === 'magazine') {
    const magTitle = form.magTitle?.value?.trim();
    const magCover = form.magCover?.value?.trim();
    const magUrl = form.magUrl?.value?.trim();
    const magDescription = form.magDescription?.value?.trim() || "";
    if (!magTitle || !magCover || !magUrl) {
      alert(lang === 'ar' ? "الرجاء تعبئة اسم المجلة، رابط الغلاف، ورابط المجلة" : "Please fill title, cover, and link");
      return;
    }
    try {
      await db.collection("materials").add({
        category: 'magazine',
        type: 'magazine',
        title: magTitle,
        coverUrl: magCover,
        url: magUrl,
        description: magDescription,
        createdAt: new Date()
      });
      alert("✅ تم رفع المجلة بنجاح - " + magTitle);
      form.reset();
    } catch (error) {
      console.error("Firebase Error:", error);
      alert("فشل الرفع: " + error.message);
    }
    return;
  }
 
 
  const subjectName = modalSubjectData ? modalSubjectData.subject : (customSubject || form.subject?.value || "عام");
 
 
  const urlValue = form.url?.value;
  const typeValue = form.type?.value || "pdf";
 
  if (!urlValue) {
    alert("يا هندسة، الرابط وين؟ لازم تضع الرابط أولاً");
    return;
  }
 
 
  const data = {
    subject: subjectName,
    courseName: adminAddMode === 'special_course' ? subjectName : null,
    title: subjectName + " - محتوى جديد", 
    url: urlValue,
    type: typeValue,
    yearId: modalSubjectData ? String(modalSubjectData.yearId) : (form.yearId?.value || null),
    semesterId: modalSubjectData ? String(modalSubjectData.semesterId) : (form.semesterId?.value || null),
    category: adminAddMode || 'academic',
    createdAt: new Date()
  };
 
  try {
   
    await db.collection("materials").add(data); 
 
    alert("✅ تم الرفع بنجاح - " + subjectName);
 
  
    form.reset();
    setCustomSubject('');
    if(typeof setIsModalOpen === 'function') setIsModalOpen(false);
 
  } catch (error) {
    console.error("Firebase Error:", error);
    alert("فشل الرفع: " + error.message);
  }
};

let swiperInstance = null;
let currentEditingId = null;
 
function initSwiperSafely() {
    if (typeof Swiper === 'undefined') {
        setTimeout(initSwiperSafely, 200);
        return;
    }
    if (swiperInstance) {
        swiperInstance.destroy(true, true);
    }
    swiperInstance = new Swiper('.mySwiper', {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: false,
        grabCursor: true,
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
    });
}
 
if (typeof db !== 'undefined') {
    db.collection('announcements').onSnapshot(function(snapshot) {
        const now = Date.now();
        let studentListHtml = '';
        let adminTableHtml = '';
 
        snapshot.forEach(function(doc) {
            const item = doc.data();
            const itemId = doc.id;
            
            const isExpired = now > item.expiresAt;
            const isShowingNow = item.isActive && !isExpired;
 
            if (isShowingNow) {
                studentListHtml += `
                    <div class="swiper-slide">
                        <div style="padding: 20px; border-radius: 24px; border-right: 5px solid #f58220; text-align: right;" 
                             class="border transition-colors duration-300 shadow-sm bg-gray-50 dark:bg-gray-800 border-gray-100 dark:border-gray-700 text-gray-800 dark:text-white shadow-gray-100/30 dark:shadow-black/20">
                            <h4 style="font-weight: 900; margin: 0; font-size: 15px;" class="text-gray-800 dark:text-white"> ${item.title}</h4>
                            <p style="font-size: 13px; margin: 8px 0 0 0; line-height: 1.6;" class="text-gray-600 dark:text-gray-300">${item.content}</p>
                        </div>
                    </div>
                `;
            }
 
            adminTableHtml += `
                <tr style="border-bottom: 1px solid #f3f4f6; font-size: 13px; text-align: right;">
                    <td style="padding: 14px; font-weight: bold;">
                        <div style="color: #1f2937;">${item.title}</div>
                        <div style="font-size: 11px; color: #9ca3af; font-weight: normal; margin-top: 2px;">${item.content}</div>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <span style="padding: 3px 10px; border-radius: 9999px; font-size: 10px; font-weight: bold; ${isShowingNow ? 'background-color: #d1fae5; color: #065f46;' : 'background-color: #fee2e2; color: #991b1b;'}">
                            ${isShowingNow ? 'نشط' : 'مخفي/منتهي'}
                        </span>
                    </td>
                    <td style="padding: 14px; text-align: center;">
                        <div style="display: flex; gap: 6px; justify-content: center; align-items: center;">
                            <button type="button" onclick="db.collection('announcements').doc('${itemId}').update({isActive: ${!item.isActive}})" style="padding: 6px 10px; border: none; background: #e5e7eb; cursor: pointer; border-radius: 8px; font-size: 12px;">👁️</button>
                            <button type="button" onclick="prepareAnnouncementForEdit('${itemId}', '${item.title.replace(/'/g, "\\'")}', '${item.content.replace(/'/g, "\\'")}')" style="padding: 6px 10px; border: none; background: #feebc8; color: #c05621; cursor: pointer; border-radius: 8px; font-size: 12px; font-weight: bold;">📝</button>
                            <button type="button" onclick="if(confirm('حذف؟')){db.collection('announcements').doc('${itemId}').delete()}" style="padding: 6px 10px; border: none; background: #fee2e2; color: #ef4444; cursor: pointer; border-radius: 8px; font-size: 12px;">🗑️</button>
                        </div>
                    </td>
                </tr>
            `;
        }); 
 
        function tryInjectingAdminTable() {
            const aTable = document.getElementById('admin-table-body');
            if (aTable) {
                aTable.innerHTML = adminTableHtml || '<tr><td colspan="3" style="text-align: center; padding: 20px; color: #9ca3af; font-size: 12px;">لا توجد سجلات.</td></tr>';
            } else {
                setTimeout(tryInjectingAdminTable, 500);
            }
        }
 
        const aList = document.getElementById('announcements-list');
        if (aList) {
            aList.innerHTML = studentListHtml || `<div class="swiper-slide text-center text-gray-400 text-sm py-4">لا توجد إعلانات نشطة حالياً.</div>`;
            if (typeof initSwiperSafely === 'function') initSwiperSafely();
        }
        
        tryInjectingAdminTable();
    });
}
 
window.prepareAnnouncementForEdit = function prepareAnnouncementForEdit(id, title, content) {
    currentEditingId = id; 
    
    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const submitBtn = document.getElementById('submit-btn');
    
    if (titleField && contentField) {
        titleField.value = title;
        contentField.value = content;
        titleField.focus(); 
        
        if (submitBtn) {
            submitBtn.innerHTML = "تحديث وحفظ التعديلات 💾";
            submitBtn.style.backgroundColor = "#d69e2e"; 
        }
    }
}
 
 
async function sendPushNotification(title, message) {
    try {
        const response = await fetch("https://gess-notifications.mazenramos0.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                message: message,
                url: window.location.origin
            })
        });

        const result = await response.json();

        if (result.success) {
            console.log("✅ الإشعار أُرسل بنجاح لـ", result.recipients, "مشترك");
        } else {
            console.warn("⚠️ OneSignal response:", result);
        }

        return result;
    } catch (e) {
        console.error("❌ خطأ في إرسال الإشعار:", e);
        return null;
    }
}

window.handlePublishAnnouncement = async function handlePublishAnnouncement() {
    const titleField = document.getElementById('form-title');
    const contentField = document.getElementById('form-content');
    const durationField = document.getElementById('form-duration');
    const submitBtn = document.getElementById('submit-btn');

    if (!titleField || !contentField || !titleField.value || !contentField.value) {
        alert("⚠️ الرجاء ملء جميع الحقول أولاً!");
        return;
    }

    const title = titleField.value;
    const content = contentField.value;
    const durationDays = parseInt(durationField.value || 7);
    const expiresTimestamp = Date.now() + (durationDays * 24 * 60 * 60 * 1000);

    // تعطيل الزر أثناء الإرسال
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "⏳ جاري النشر والإرسال...";
    }

    if (typeof db !== 'undefined') {
        if (currentEditingId) {
            // ── تعديل إعلان موجود ──
            db.collection('announcements').doc(currentEditingId).update({
                title: title,
                content: content,
                expiresAt: expiresTimestamp
            }).then(async function() {
                // ✅ إرسال الإشعار بعد التعديل
                await sendPushNotification(title, content);
                alert("🚀 تم تحديث الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("خطأ أثناء التعديل:", error);
                alert("❌ حدث خطأ أثناء التعديل: " + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "تحديث وحفظ التعديلات 💾";
                }
            });
        } else {
            // ── نشر إعلان جديد ──
            db.collection('announcements').add({
                title: title,
                content: content,
                createdAt: Date.now(),
                expiresAt: expiresTimestamp,
                isActive: true
            }).then(async function() {
                // ✅ إرسال الإشعار بعد الحفظ — كان مفقوداً هنا!
                await sendPushNotification(title, content);
                alert("🚀 تم نشر الإعلان وإرسال إشعار لجميع الطلاب!");
                window.resetFormState();
            }).catch(function(error) {
                console.error("حدث خطأ أثناء الحفظ:", error);
                alert("❌ حدث خطأ أثناء الحفظ: " + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "نشر الإعلان وإرسال إشعار 🚀";
                }
            });
        }
    }
}
 
window.resetFormState = function resetFormState() {
    currentEditingId = null;
    document.getElementById('form-title').value = '';
    document.getElementById('form-content').value = '';
    
    const submitBtn = document.getElementById('submit-btn');
