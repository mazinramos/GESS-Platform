      // React بيفضل شايف مرجع قديم للعنصر، ولما يحاول يشيله بيحصل خطأ removeChild ويوقع الصفحة شاشة بيضاء.
      // الباتش ده بيتأكد إن العنصر لسه موجود فعلاً جوه أبوه قبل ما يحاول يشيله أو يضيف قبله.
      (function () {
        const origRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) {
            if (console) console.warn('تم تجاهل محاولة إزالة عنصر غير موجود (حماية من تعارض lucide)', child);
            return child;
          }
          return origRemoveChild.apply(this, arguments);
        };
        const origInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (console) console.warn('تم تجاهل محاولة إدراج قبل عنصر غير موجود (حماية من تعارض lucide)', referenceNode);
            return this.appendChild(newNode);
          }
          return origInsertBefore.apply(this, arguments);
        };
      })();

        function driveImageDirectUrl(url) {
            if (!url) return url;
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/) || url.match(/id=([a-zA-Z0-9-_]+)/);
                if (match && match[1]) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
            }
            return url;
        }

        // يحوّل createdAt (سواء Firestore Timestamp أو تاريخ عادي) لعدد ميلي ثانية للمقارنة
        function toMillis(createdAt) {
            if (!createdAt) return 0;
            const date = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
            const ms = date.getTime();
            return isNaN(ms) ? 0 : ms;
        }

        // بيرجع id آخر مجلة تمت إضافتها (الأحدث بتاريخ createdAt) عشان نعرض شارة "جديد" عليها بس
        function getLatestMagazineId(magazinesList) {
            if (!magazinesList || magazinesList.length === 0) return null;
            let latest = magazinesList[0];
            for (const m of magazinesList) {
                if (toMillis(m.createdAt) > toMillis(latest.createdAt)) latest = m;
            }
            return latest.id;
        }

                    <span className="shine"></span>
                </span>
            );
        }

                { id: 'home', icon: 'home', label: lang === 'ar' ? 'الرئيسية' : 'Home',

                { id: 'magazines', icon: 'library', label: lang === 'ar' ? 'المجلات' : 'Magazines',
                  onClick: () => { setSelectedItem(null); setPath([{ id: 'magazines', type: 'magazines_section' }]); } },
                { id: 'ai', icon: 'sparkles', label: lang === 'ar' ? 'المساعد الذكي' : 'AI Assistant',
                  onClick: () => { setSelectedItem(null); setPath([{ id: 'ai_chat', type: 'ai_chat' }]); } },
                { id: 'duas', icon: 'moon-star', label: lang === 'ar' ? 'الأدعية' : 'Duas',
                  onClick: () => { setSelectedItem(null); setPath([{ id: 'supplications', type: 'supplications' }]); } },
            ];

            const activeId =
                path.length === 0 ? 'home' :
                path[0]?.id === 'courses' ? 'courses' :

            return (
                <nav className={`fixed bottom-0 left-0 right-0 z-[90] border-t transition-colors ${
                    darkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-200'

                    <div className="max-w-md mx-auto grid grid-cols-5">

                            <button

                                <i data-lucide={item.icon} className="w-6 h-6" style={{ strokeWidth: activeId === item.id ? 2.4 : 1.8 }}></i>
                                <span className={`text-[10px] leading-none ${activeId === item.id ? 'font-bold' : 'font-medium'}`}>{item.label}</span>
                            </button>

            );
        }

        function GlobalSearchModal({ lang, darkMode, contents, onClose, onSelectItem }) {
            const [query, setQuery] = React.useState('');
            const inputRef = React.useRef(null);

            React.useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
                const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            const typeMeta = {
                academic: { icon: 'book-marked', label: lang === 'ar' ? 'مادة دراسية' : 'Subject' },
                special_course: { icon: 'rocket', label: lang === 'ar' ? 'كورس تدريبي' : 'Course' },
                training: { icon: 'dumbbell', label: lang === 'ar' ? 'تدريب' : 'Training' },
                magazine: { icon: 'library', label: lang === 'ar' ? 'مجلة' : 'Magazine' },
            };
            const typeIcons = {
                video: 'video', pdf: 'file-text', exam: 'clipboard-list', references: 'external-link',
                ppt: 'presentation', voice: 'mic', labs: 'flask-conical', sheets: 'table', magazine: 'library'
            };

            const results = React.useMemo(() => {
                const q = query.trim().toLowerCase();
                if (q.length < 2) return [];
                return contents.filter(item => {
                    const haystack = [item.title, item.subject, item.courseName, item.trainingName, item.description, item.type]
                        .filter(Boolean).join(' ').toLowerCase();
                    return haystack.includes(q);
                }).slice(0, 40);
            }, [query, contents]);

            return (
                <div
                    className="fixed inset-0 z-[200] flex items-start justify-center bg-black/60 backdrop-blur-md p-4 pt-16 md:pt-24 animate-in fade-in duration-200"
                    onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
                >
                    <div className={`w-full max-w-xl rounded-[2rem] shadow-2xl overflow-hidden flex flex-col max-h-[75vh] border ${darkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-100'}`}>
                        <div className={`p-4 flex items-center gap-3 border-b ${darkMode ? 'border-gray-800' : 'border-gray-100'}`}>
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-[#f58220] to-[#ff9d4d] flex items-center justify-center shrink-0">
                                <i data-lucide="search" className="w-4 h-4 text-white"></i>
                            </div>
                            <input
                                ref={inputRef}
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder={lang === 'ar' ? 'ابحث عن مادة، كورس، تدريب، مجلة...' : 'Search subjects, courses, training, magazines...'}
                                className={`flex-1 bg-transparent outline-none text-sm font-bold ${darkMode ? 'text-white placeholder:text-gray-500' : 'text-gray-800 placeholder:text-gray-400'}`}
                            />
                            <button onClick={onClose} className={`p-2 rounded-xl transition-colors ${darkMode ? 'hover:bg-gray-800 text-gray-400' : 'hover:bg-gray-100 text-gray-500'}`}>
                                <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3">
                            {query.trim().length < 2 && (
                                <div className="text-center py-16 opacity-70">
                                    <i data-lucide="search" className="w-10 h-10 mx-auto mb-3 text-orange-300"></i>
                                    <p className="text-sm text-gray-400 font-bold">{lang === 'ar' ? 'اكتب حرفين على الأقل للبحث في كل المنصة' : 'Type at least 2 characters to search the whole platform'}</p>
                                </div>
                            )}

                            {query.trim().length >= 2 && results.length === 0 && (
                                <div className="text-center py-16 opacity-70">
                                    <i data-lucide="search-x" className="w-10 h-10 mx-auto mb-3 text-gray-300"></i>
                                    <p className="text-sm text-gray-400 font-bold">{lang === 'ar' ? 'ما في نتائج مطابقة' : 'No matching results'}</p>
                                </div>
                            )}

                            <div className="space-y-1.5">
                                {results.map(item => {
                                    const meta = typeMeta[item.category] || { label: item.type };
                                    const icon = typeIcons[item.type] || 'file-text';
                                    const subLabel = item.subject || item.courseName || item.trainingName || '';
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => onSelectItem(item)}
                                            className={`w-full flex items-center gap-3 p-3 rounded-2xl text-right transition-all ${darkMode ? 'hover:bg-gray-800' : 'hover:bg-orange-50'}`}
                                        >
                                            <div className="w-10 h-10 rounded-xl bg-orange-100 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center shrink-0">
                                                <i data-lucide={icon} className="w-5 h-5"></i>
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <h4 className={`font-bold text-sm truncate ${darkMode ? 'text-white' : 'text-gray-900'}`}>{item.title}</h4>
                                                <p className="text-[11px] text-gray-400 font-bold truncate">
                                                    {meta.label}{subLabel ? ' • ' + subLabel : ''}
                                                </p>
                                            </div>
                                            <i data-lucide="chevron-left" className="w-4 h-4 text-gray-300 shrink-0"></i>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AIChatPanel({ lang, darkMode, contents }) {
            const [messages, setMessages] = React.useState([
                { role: 'assistant', content: lang === 'ar'
                    ? 'أهلاً! أنا المساعد الذكي لمنصة GESS EDU. اسألني عن أي مادة أو موضوع هندسي 👋'
                    : 'Hi! I am the GESS EDU AI Assistant. Ask me anything 👋' }
            ]);
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const scrollRef = React.useRef(null);

            React.useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages, loading]);

            // 👇 غيّر الرابط دا برابط الـ Cloudflare Worker بتاعك بعد نشره (شوف الدليل المرفق)
            const AI_WORKER_URL = "https://gess-ai-chat.mazinflwo-dev.workers.dev";

            // بناء قائمة مختصرة بمحتوى المنهج (المواد/الدروس/المجلات) الموجود فعليًا في المنصة
            // عشان المساعد الذكي يعرف يجاوب في حدود المنهج المتاح، ويرشد الطالب للمحتوى المناسب
            const buildCurriculumSummary = () => {
                if (!contents || contents.length === 0) return "";
                const lines = contents.slice(0, 200).map(c => {
                    const subject = c.subject ? `[${c.subject}] ` : '';
                    const category = c.category || c.type || '';
                    return `- ${subject}${c.title || ''}${category ? ` (${category})` : ''}`;
                });
                return lines.join('\n');
            };

            const sendMessage = async () => {
                const text = input.trim();
                if (!text || loading) return;
                const newMessages = [...messages, { role: 'user', content: text }];
                setMessages(newMessages);
                setInput('');
                setLoading(true);
                try {
                    const res = await fetch(AI_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            messages: newMessages,
                            lang,
                            curriculum: buildCurriculumSummary()
                        })
                    });
                    const data = await res.json();
                    setMessages([...newMessages, { role: 'assistant', content: data.reply || (lang === 'ar' ? 'تعذر الحصول على رد الآن.' : 'Could not get a reply.') }]);
                } catch (err) {
                    setMessages([...newMessages, { role: 'assistant', content: lang === 'ar' ? '⚠️ تعذر الاتصال بالمساعد الذكي. تأكد من ربط رابط الـ Worker.' : '⚠️ Could not reach the AI assistant.' }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-2xl mx-auto animate-in fade-in duration-500">
                    <div className="text-center mb-6">
                        <div className="inline-flex items-center gap-3 px-6 py-3 rounded-full bg-orange-100 text-orange-600 font-black text-sm mb-4">
                            <i data-lucide="sparkles" className="w-5 h-5"></i>
                            {lang === 'ar' ? 'المساعد الذكي' : 'AI Assistant'}
                        </div>
                    </div>

                    <div className={`rounded-[2.5rem] border shadow-xl overflow-hidden flex flex-col h-[65vh] ${darkMode ? 'bg-gray-900 border-gray-800' : 'bg-white border-gray-100'}`}>
                        <div ref={scrollRef} className="flex-1 overflow-y-auto p-5 space-y-4">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-start' : 'justify-end'}`}>
                                    <div className={`max-w-[80%] px-4 py-3 rounded-2xl text-sm font-medium leading-relaxed ${
                                        m.role === 'user'
                                            ? (darkMode ? 'bg-gray-800 text-white rounded-tl-sm' : 'bg-gray-100 text-gray-800 rounded-tl-sm')
                                            : 'bg-[#f58220] text-white rounded-tr-sm'
                                    }`}>
                                        {m.content}
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-end">
                                    <div className="px-4 py-3 rounded-2xl bg-[#f58220]/70 text-white text-sm font-bold animate-pulse">
                                        {lang === 'ar' ? 'يكتب...' : 'Typing...'}
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className={`p-3 border-t flex gap-2 ${darkMode ? 'border-gray-800' : 'border-gray-100'}`}>
                            <input
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') sendMessage(); }}
                                placeholder={lang === 'ar' ? 'اكتب سؤالك هنا...' : 'Type your question...'}
                                className={`flex-1 p-3 rounded-xl border-2 outline-none text-sm ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                            />
                            <button onClick={sendMessage} disabled={loading} className="bg-[#f58220] hover:bg-[#e67610] disabled:opacity-50 text-white px-5 rounded-xl font-black text-sm">
                                {lang === 'ar' ? 'إرسال' : 'Send'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // نافذة تسجيل الدخول / إنشاء حساب (اختيارية بالكامل)
        // زجاجية (glassmorphism) + متحركة + بهوية GESS البصرية
        // ============================================================
        // ============================================================
        // نافذة مشاركة المنصة (fallback للمتصفحات اللي مفيهاش قائمة مشاركة أصلية،
        // زي أغلب متصفحات الديسكتوب)
        // ============================================================
        function ShareModal({ lang, darkMode, shareUrl, onClose }) {
            const [copied, setCopied] = React.useState(false);

            const shareText = lang === 'ar'
                ? 'منصة GESS EDU التعليمية لطلاب هندسة المساحة - جامعة الخرطوم'
                : 'GESS EDU - Educational platform for Surveying Engineering students';

            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText + '\n' + shareUrl)}`;
            const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`;

            const handleCopy = async () => {
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    alert(shareUrl);
                }
            };

            return (
                <div className="fixed inset-0 z-[300] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}></div>
                    <div className={`relative w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden animate-in zoom-in-95 fade-in duration-200 ${darkMode ? 'bg-gray-900' : 'bg-white'}`}>
                        <div className="p-6 text-center border-b" style={{ borderColor: darkMode ? '#374151' : '#f0f0f0' }}>
                            <div className="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-[#f58220] to-[#ff5b3d] flex items-center justify-center shadow-lg mb-3">
                                <i data-lucide="share-2" className="w-7 h-7 text-white"></i>
                            </div>
                            <h3 className={`font-black text-lg ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                                {lang === 'ar' ? 'شارك منصة GESS EDU' : 'Share GESS EDU'}
                            </h3>
                        </div>

                        <div className="p-5 space-y-2.5">
                            <a
                                href={whatsappUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                onClick={onClose}
                                className="flex items-center gap-3 w-full p-3.5 rounded-2xl font-bold text-sm bg-[#25D366] text-white hover:opacity-90 transition-opacity"
                            >
                                <i data-lucide="message-circle" className="w-5 h-5"></i>
                                {lang === 'ar' ? 'واتساب' : 'WhatsApp'}
                            </a>

                            <a
                                href={telegramUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                onClick={onClose}
                                className="flex items-center gap-3 w-full p-3.5 rounded-2xl font-bold text-sm bg-[#229ED9] text-white hover:opacity-90 transition-opacity"
                            >
                                <i data-lucide="send" className="w-5 h-5"></i>
                                {lang === 'ar' ? 'تيليجرام' : 'Telegram'}
                            </a>

                            <button
                                onClick={handleCopy}
                                className={`flex items-center gap-3 w-full p-3.5 rounded-2xl font-bold text-sm transition-colors ${
                                    darkMode ? 'bg-gray-800 text-gray-200 hover:bg-gray-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                }`}
                            >
                                <i data-lucide={copied ? "check" : "link"} className="w-5 h-5"></i>
                                {copied
                                    ? (lang === 'ar' ? 'تم نسخ الرابط ✓' : 'Link copied ✓')
                                    : (lang === 'ar' ? 'نسخ الرابط' : 'Copy Link')}
                            </button>

                            <button
                                onClick={onClose}
                                className={`w-full text-center text-xs font-medium pt-2 ${darkMode ? 'text-gray-500 hover:text-gray-300' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                {lang === 'ar' ? 'إلغاء' : 'Cancel'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AuthModal({ lang, darkMode, mode, setMode, onClose, onAuthSuccess }) {
            const [fullName, setFullName] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [year, setYear] = React.useState('1');
            const [specialization, setSpecialization] = React.useState(lang === 'ar' ? 'هندسة المساحة' : 'Geomatics Engineering');
            const [studentId, setStudentId] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            const isSignup = mode === 'signup';

            const friendlyError = (code) => {
                const map = {
                    'auth/email-already-in-use': lang === 'ar' ? 'البريد الإلكتروني ده مسجل قبل كده' : 'This email is already registered',
                    'auth/invalid-email': lang === 'ar' ? 'صيغة البريد الإلكتروني غير صحيحة' : 'Invalid email format',
                    'auth/weak-password': lang === 'ar' ? 'كلمة المرور لازم تكون 6 أحرف على الأقل' : 'Password must be at least 6 characters',
                    'auth/wrong-password': lang === 'ar' ? 'كلمة المرور غير صحيحة' : 'Incorrect password',
                    'auth/user-not-found': lang === 'ar' ? 'مفيش حساب بهذا البريد الإلكتروني' : 'No account found with this email',
                    'auth/invalid-credential': lang === 'ar' ? 'البريد الإلكتروني أو كلمة المرور غير صحيحة' : 'Incorrect email or password',
                    'auth/too-many-requests': lang === 'ar' ? 'محاولات كتيرة جدًا، حاول بعد شوية' : 'Too many attempts, try again later',
                };
                return map[code] || (lang === 'ar' ? 'حصل خطأ، حاول تاني' : 'Something went wrong, please try again');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    if (isSignup) {
                        const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
                        await cred.user.updateProfile({ displayName: fullName.trim() });
                        await db.collection('users').doc(cred.user.uid).set({
                            fullName: fullName.trim(),
                            email: email.trim(),
                            year: year,
                            specialization: specialization.trim(),
                            studentId: studentId.trim(),
                            phone: '',
                            bio: '',
                            status: 'active',
                            role: 'student',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        });
                    } else {
                        await auth.signInWithEmailAndPassword(email.trim(), password);
                    }
                    onAuthSuccess();
                } catch (err) {
                    console.error('Auth error:', err);
                    setError(friendlyError(err.code));
                } finally {
                    setLoading(false);
                }
            };

            const handleForgotPassword = async () => {
                if (!email.trim()) {
                    setError(lang === 'ar' ? 'اكتب بريدك الإلكتروني الأول عشان نبعتلك رابط الاستعادة' : 'Enter your email first so we can send a reset link');
                    return;
                }
                try {
                    await auth.sendPasswordResetEmail(email.trim());
                    setError('');
                    alert(lang === 'ar' ? '✅ اتبعت رابط استعادة كلمة المرور لبريدك الإلكتروني' : '✅ Password reset link sent to your email');
                } catch (err) {
                    setError(friendlyError(err.code));
                }
            };

            return (
                <div
                    className="fixed inset-0 z-[300] flex items-center justify-center p-4 animate-in fade-in duration-300"
                >
                    {/* خلفية زجاجية داكنة متدرجة - دوسها يقفل النافذة */}
                    <div className="absolute inset-0 bg-gradient-to-br from-[#1a1006]/90 via-black/80 to-[#2b1400]/90 backdrop-blur-xl" onClick={onClose}></div>

                    {/* دوائر زخرفية متحركة عائمة */}
                    <div className="absolute -top-20 -left-20 w-72 h-72 rounded-full bg-[#f58220]/20 blur-3xl animate-pulse pointer-events-none"></div>
                    <div className="absolute -bottom-24 -right-16 w-96 h-96 rounded-full bg-[#f58220]/15 blur-3xl animate-pulse pointer-events-none" style={{ animationDelay: '1s' }}></div>
                    <div className="absolute top-1/3 right-10 w-24 h-24 rounded-full bg-white/10 blur-2xl animate-bounce pointer-events-none" style={{ animationDuration: '4s' }}></div>

                    {/* بطاقة النافذة الزجاجية */}
                    <div
                        key={mode}
                        className="relative w-full max-w-md rounded-[2.5rem] border border-white/20 shadow-2xl overflow-hidden animate-in zoom-in-95 fade-in duration-300 max-h-[92vh] flex flex-col"
                        style={{ background: 'rgba(255,255,255,0.08)', backdropFilter: 'blur(24px)', WebkitBackdropFilter: 'blur(24px)' }}
                    >
                        <div className="p-8 pb-4 shrink-0 text-center">
                            <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-[#f58220] to-[#ff5b3d] flex items-center justify-center shadow-lg shadow-orange-900/40 mb-4">
                                <i data-lucide={isSignup ? 'user-plus' : 'log-in'} className="w-8 h-8 text-white"></i>
                            </div>
                            <h2 className="text-2xl font-black text-white">
                                {isSignup
                                    ? (lang === 'ar' ? 'إنشاء حساب جديد' : 'Create an Account')
                                    : (lang === 'ar' ? 'تسجيل الدخول' : 'Welcome Back')}
                            </h2>
                            <p className="text-sm text-white/60 mt-1 font-medium">
                                {isSignup
                                    ? (lang === 'ar' ? 'احصل على ملف شخصي ومسار أكاديمي محفوظ' : 'Get a saved profile & academic path')
                                    : (lang === 'ar' ? 'سجّل دخولك للوصول لملفك الشخصي' : 'Log in to access your profile')}
                            </p>
                        </div>

                        <form onSubmit={handleSubmit} className="px-8 pb-8 space-y-3 overflow-y-auto">
                            {error && (
                                <div className="bg-red-500/15 border border-red-400/30 text-red-100 text-xs font-bold rounded-xl p-3 text-center">
                                    {error}
                                </div>
                            )}

                            {isSignup && (
                                <input
                                    required
                                    value={fullName}
                                    onChange={(e) => setFullName(e.target.value)}
                                    placeholder={lang === 'ar' ? 'الاسم الكامل' : 'Full Name'}
                                    className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 outline-none focus:border-[#f58220] transition-all font-medium"
                                />
                            )}

                            <input
                                required
                                type="email"
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                placeholder={lang === 'ar' ? 'البريد الإلكتروني' : 'Email'}
                                className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 outline-none focus:border-[#f58220] transition-all font-medium"
                                dir="ltr"
                            />

                            <input
                                required
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                placeholder={lang === 'ar' ? 'كلمة المرور' : 'Password'}
                                className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 outline-none focus:border-[#f58220] transition-all font-medium"
                                dir="ltr"
                            />

                            {isSignup && (
                                <>
                                    <div className="grid grid-cols-2 gap-3">
                                        <select
                                            value={year}
                                            onChange={(e) => setYear(e.target.value)}
                                            className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white outline-none focus:border-[#f58220] transition-all font-medium [&>option]:text-black"
                                        >
                                            {[1, 2, 3, 4, 5].map(y => (
                                                <option key={y} value={y}>{lang === 'ar' ? `السنة ${['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة'][y - 1]}` : `Year ${y}`}</option>
                                            ))}
                                        </select>
                                        <input
                                            value={studentId}
                                            onChange={(e) => setStudentId(e.target.value)}
                                            placeholder={lang === 'ar' ? 'الرقم الجامعي (اختياري)' : 'Student ID (optional)'}
                                            className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 outline-none focus:border-[#f58220] transition-all font-medium text-sm"
                                        />
                                    </div>
                                    <input
                                        value={specialization}
                                        onChange={(e) => setSpecialization(e.target.value)}
                                        placeholder={lang === 'ar' ? 'التخصص' : 'Specialization'}
                                        className="w-full p-3.5 rounded-2xl bg-white/10 border border-white/20 text-white placeholder:text-white/40 outline-none focus:border-[#f58220] transition-all font-medium"
                                    />
                                </>
                            )}

                            {!isSignup && (
                                <button type="button" onClick={handleForgotPassword} className="text-xs text-white/60 hover:text-white font-bold transition-colors">
                                    {lang === 'ar' ? 'نسيت كلمة المرور؟' : 'Forgot password?'}
                                </button>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full p-4 rounded-2xl bg-gradient-to-r from-[#f58220] to-[#ff5b3d] text-white font-black shadow-lg shadow-orange-900/30 hover:shadow-orange-900/50 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:opacity-60 disabled:hover:scale-100 flex items-center justify-center gap-2"
                            >
                                {loading ? (
                                    <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                                ) : (
                                    <span>{isSignup ? (lang === 'ar' ? 'إنشاء الحساب' : 'Create Account') : (lang === 'ar' ? 'دخول' : 'Log In')}</span>
                                )}
                            </button>

                            <div className="text-center pt-2">
                                <button
                                    type="button"
                                    onClick={() => { setMode(isSignup ? 'login' : 'signup'); setError(''); }}
                                    className="text-sm text-white/70 hover:text-white font-bold transition-colors"
                                >
                                    {isSignup
                                        ? (lang === 'ar' ? 'عندك حساب؟ سجّل دخولك' : 'Have an account? Log in')
                                        : (lang === 'ar' ? 'ما عندك حساب؟ أنشئ واحد' : "Don't have an account? Sign up")}
                                </button>
                            </div>

                            <button
                                type="button"
                                onClick={onClose}
                                className="w-full text-center text-xs text-white/40 hover:text-white/70 font-medium pt-1 transition-colors"
                            >
                                {lang === 'ar' ? 'متابعة التصفح كزائر' : 'Continue browsing as guest'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ============================================================
        // صفحة الملف الشخصي: بيانات الطالب، مساره الأكاديمي، وتفاصيله الشخصية
        // ============================================================
        function ProfilePage({ lang, darkMode, authUser, userProfile, onBack, onSignOut, onSaved }) {
            const [year, setYear] = React.useState(userProfile?.year || '1');
            const [specialization, setSpecialization] = React.useState(userProfile?.specialization || '');
            const [studentId, setStudentId] = React.useState(userProfile?.studentId || '');
            const [phone, setPhone] = React.useState(userProfile?.phone || '');
            const [bio, setBio] = React.useState(userProfile?.bio || '');
            const [saving, setSaving] = React.useState(false);
            const [saved, setSaved] = React.useState(false);

            React.useEffect(() => {
                setYear(userProfile?.year || '1');
                setSpecialization(userProfile?.specialization || '');
                setStudentId(userProfile?.studentId || '');
                setPhone(userProfile?.phone || '');
                setBio(userProfile?.bio || '');
            }, [userProfile]);

            const yearLabels = lang === 'ar'
                ? ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة']
                : ['1st', '2nd', '3rd', '4th', '5th'];

            const handleSave = async () => {
                if (!authUser) return;
                setSaving(true);
                try {
                    await db.collection('users').doc(authUser.uid).set({
                        year, specialization: specialization.trim(), studentId: studentId.trim(),
                        phone: phone.trim(), bio: bio.trim(),
                    }, { merge: true });
                    if (window.gessRefreshProfile) window.gessRefreshProfile();
                    setSaved(true);
                    setTimeout(() => setSaved(false), 2500);
                    if (onSaved) onSaved();
                } catch (err) {
                    console.error('Profile save error:', err);
                    alert(lang === 'ar' ? '⚠️ تعذر حفظ التعديلات' : '⚠️ Could not save changes');
                } finally {
                    setSaving(false);
                }
            };

            const initial = (userProfile?.fullName || authUser?.displayName || '?').trim().charAt(0).toUpperCase();

            return (
                <div className="max-w-2xl mx-auto animate-in">
                    <button
                        onClick={onBack}
                        className={`flex items-center gap-2 mb-5 font-bold text-sm ${darkMode ? 'text-gray-300 hover:text-white' : 'text-gray-600 hover:text-gray-900'}`}
                    >
                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                        {lang === 'ar' ? 'رجوع للرئيسية' : 'Back to Home'}
                    </button>

                    {/* بطاقة الهيدر: صورة رمزية + الاسم + البريد */}
                    <div className="relative rounded-[2.5rem] overflow-hidden mb-6 p-8 bg-gradient-to-br from-[#f58220] to-[#ff5b3d] text-white shadow-xl shadow-orange-900/20">
                        <div className="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-white/10 blur-2xl"></div>
                        <div className="absolute -bottom-14 -left-10 w-48 h-48 rounded-full bg-white/10 blur-2xl"></div>
                        <div className="relative flex items-center gap-5">
                            <div className="w-20 h-20 rounded-3xl bg-white/20 border-2 border-white/40 flex items-center justify-center text-3xl font-black shrink-0">
                                {initial}
                            </div>
                            <div className="min-w-0">
                                <h2 className="text-2xl font-black truncate">{userProfile?.fullName || authUser?.displayName}</h2>
                                <p className="text-white/80 text-sm font-medium truncate" dir="ltr">{authUser?.email}</p>
                                {userProfile?.studentId && (
                                    <p className="text-white/70 text-xs font-bold mt-1">{lang === 'ar' ? 'رقم جامعي: ' : 'ID: '}{userProfile.studentId}</p>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* المسار الأكاديمي - Stepper بصري */}
                    <div className={`rounded-[2rem] border p-6 mb-6 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100 shadow-sm'}`}>
                        <h3 className={`font-black mb-5 flex items-center gap-2 ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                            <i data-lucide="route" className="w-4 h-4 text-[#f58220]"></i>
                            {lang === 'ar' ? 'المسار الأكاديمي' : 'Academic Path'}
                        </h3>
                        <div className="flex items-center justify-between">
                            {yearLabels.map((label, idx) => {
                                const stepYear = String(idx + 1);
                                const isDone = Number(stepYear) < Number(year);
                                const isCurrent = stepYear === String(year);
                                return (
                                    <React.Fragment key={idx}>
                                        <div className="flex flex-col items-center gap-2">
                                            <div className={`w-9 h-9 rounded-full flex items-center justify-center text-xs font-black transition-all ${
                                                isCurrent ? 'bg-[#f58220] text-white ring-4 ring-orange-200 scale-110' :
                                                isDone ? 'bg-orange-100 text-[#f58220]' :
                                                (darkMode ? 'bg-gray-700 text-gray-400' : 'bg-gray-100 text-gray-400')
                                            }`}>
                                                {isDone ? <i data-lucide="check" className="w-4 h-4"></i> : idx + 1}
                                            </div>
                                            <span className={`text-[10px] font-bold ${isCurrent ? 'text-[#f58220]' : 'text-gray-400'}`}>{label}</span>
                                        </div>
                                        {idx < yearLabels.length - 1 && (
                                            <div className={`flex-1 h-1 rounded-full mx-1 ${Number(stepYear) < Number(year) ? 'bg-[#f58220]' : (darkMode ? 'bg-gray-700' : 'bg-gray-100')}`}></div>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    </div>

                    {/* بيانات قابلة للتعديل */}
                    <div className={`rounded-[2rem] border p-6 mb-6 space-y-4 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100 shadow-sm'}`}>
                        <h3 className={`font-black mb-2 flex items-center gap-2 ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                            <i data-lucide="id-card" className="w-4 h-4 text-[#f58220]"></i>
                            {lang === 'ar' ? 'التفاصيل الشخصية والأكاديمية' : 'Personal & Academic Details'}
                        </h3>

                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-xs font-bold text-gray-400 mb-1 block">{lang === 'ar' ? 'السنة الدراسية' : 'Academic Year'}</label>
                                <select
                                    value={year}
                                    onChange={(e) => setYear(e.target.value)}
                                    className={`w-full p-3 rounded-xl border-2 outline-none font-bold transition-all ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                                >
                                    {[1, 2, 3, 4, 5].map(y => (
                                        <option key={y} value={y}>{lang === 'ar' ? `السنة ${yearLabels[y - 1]}` : `Year ${y}`}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-400 mb-1 block">{lang === 'ar' ? 'الرقم الجامعي' : 'Student ID'}</label>
                                <input
                                    value={studentId}
                                    onChange={(e) => setStudentId(e.target.value)}
                                    className={`w-full p-3 rounded-xl border-2 outline-none font-bold transition-all ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                                />
                            </div>
                        </div>

                        <div>
                            <label className="text-xs font-bold text-gray-400 mb-1 block">{lang === 'ar' ? 'التخصص' : 'Specialization'}</label>
                            <input
                                value={specialization}
                                onChange={(e) => setSpecialization(e.target.value)}
                                className={`w-full p-3 rounded-xl border-2 outline-none font-bold transition-all ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                            />
                        </div>

                        <div>
                            <label className="text-xs font-bold text-gray-400 mb-1 block">{lang === 'ar' ? 'رقم الهاتف' : 'Phone Number'}</label>
                            <input
                                value={phone}
                                onChange={(e) => setPhone(e.target.value)}
                                dir="ltr"
                                className={`w-full p-3 rounded-xl border-2 outline-none font-bold transition-all ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                            />
                        </div>

                        <div>
                            <label className="text-xs font-bold text-gray-400 mb-1 block">{lang === 'ar' ? 'نبذة عني' : 'About Me'}</label>
                            <textarea
                                value={bio}
                                onChange={(e) => setBio(e.target.value)}
                                rows="3"
                                className={`w-full p-3 rounded-xl border-2 outline-none font-medium resize-none transition-all ${darkMode ? 'bg-gray-900 border-gray-700 text-white' : 'bg-gray-50 border-gray-200'}`}
                            />
                        </div>

                        <button
                            onClick={handleSave}
                            disabled={saving}
                            className="w-full p-4 rounded-2xl bg-gradient-to-r from-[#f58220] to-[#ff5b3d] text-white font-black shadow-lg hover:shadow-xl hover:scale-[1.01] active:scale-[0.99] transition-all disabled:opacity-60 flex items-center justify-center gap-2"
                        >
                            {saving ? <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i> :
                             saved ? <><i data-lucide="check" className="w-5 h-5"></i>{lang === 'ar' ? 'تم الحفظ' : 'Saved'}</> :
                             (lang === 'ar' ? 'حفظ التعديلات' : 'Save Changes')}
                        </button>
                    </div>

                    <button
                        onClick={onSignOut}
                        className={`w-full p-4 rounded-2xl font-black transition-all flex items-center justify-center gap-2 border-2 ${darkMode ? 'border-red-900/50 text-red-400 hover:bg-red-900/20' : 'border-red-100 text-red-500 hover:bg-red-50'}`}
                    >
                        <i data-lucide="log-out" className="w-4 h-4"></i>
                        {lang === 'ar' ? 'تسجيل الخروج' : 'Sign Out'}
                    </button>
                </div>
            );
        }

        // ============================================================
        // لوحة الأدمن: عرض كل الطلاب المسجلين، فلترة بالسنة والحالة، وبحث
        // ============================================================
        // تنسيق تاريخ Firestore Timestamp أو Date عادي لعرض مقروء
        function formatStudentDate(ts, lang) {
            if (!ts) return '-';
            const date = ts.toDate ? ts.toDate() : new Date(ts);
            if (isNaN(date.getTime())) return '-';
            return date.toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function yearLabelText(y, lang) {
            const labels = lang === 'ar'
                ? { '1': 'الأولى', '2': 'الثانية', '3': 'الثالثة', '4': 'الرابعة', '5': 'الخامسة' }
                : { '1': '1st', '2': '2nd', '3': '3rd', '4': '4th', '5': '5th' };
            return labels[String(y)] || y || '-';
        }

        // رقم الدفعة محسوب من السنة الدراسية: كل ما السنة تزيد، رقم الدفعة بينزل
        // (السنة الأولى = 023، الثانية = 022، الثالثة = 021، الرابعة = 020، الخامسة = 019)
        function batchLabelForYear(year) {
            const y = Number(year);
            if (!y || y < 1 || y > 5) return '-';
            const batchNumber = 24 - y;
            return String(batchNumber).padStart(3, '0');
        }

        // ============================================================
        // الملف الرسمي القابل للطباعة/الحفظ كـ PDF لطالب واحد
        // ============================================================
        function StudentPrintFile({ student, lang }) {
            if (!student) return null;
            const yearLabels = lang === 'ar' ? ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة'] : ['1st', '2nd', '3rd', '4th', '5th'];
            const rows = [
                [lang === 'ar' ? 'الاسم الكامل' : 'Full Name', student.fullName || '-'],
                [lang === 'ar' ? 'البريد الإلكتروني' : 'Email', student.email || '-'],
                [lang === 'ar' ? 'الرقم الجامعي' : 'Student ID', student.studentId || '-'],
                [lang === 'ar' ? 'السنة الدراسية' : 'Academic Year', lang === 'ar' ? `السنة ${yearLabelText(student.year, lang)}` : `Year ${student.year || '-'}`],
                [lang === 'ar' ? 'التخصص' : 'Specialization', student.specialization || '-'],
                [lang === 'ar' ? 'رقم الهاتف' : 'Phone', student.phone || '-'],
                [lang === 'ar' ? 'الحالة' : 'Status', (student.status || 'active') === 'suspended' ? (lang === 'ar' ? 'موقوف' : 'Suspended') : (lang === 'ar' ? 'نشط' : 'Active')],
                [lang === 'ar' ? 'تاريخ التسجيل بالمنصة' : 'Registered On', formatStudentDate(student.createdAt, lang)],
            ];

            return (
                <div dir={lang === 'ar' ? 'rtl' : 'ltr'} style={{ fontFamily: 'Tajawal, sans-serif', color: '#1a1a1a', padding: '12mm', position: 'relative' }}>
                    {/* شريط جانبي زخرفي بلون الهوية */}
                    <div style={{ position: 'absolute', top: 0, bottom: 0, [lang === 'ar' ? 'right' : 'left']: 0, width: '6px', background: 'linear-gradient(180deg,#F58220,#ff5b3d)' }}></div>

                    {/* ترويسة رسمية */}
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '4px solid #F58220', paddingBottom: '16px', marginBottom: '24px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                            <img src={GESS_LOGO} alt="GESS" style={{ width: '64px', height: '64px', borderRadius: '16px', objectFit: 'contain', background: '#fff', border: '1px solid #eee' }} />
                            <div>
                                <div style={{ fontWeight: 900, fontSize: '20px' }}>{lang === 'ar' ? 'جامعة الخرطوم' : 'University of Khartoum'}</div>
                                <div style={{ fontWeight: 700, fontSize: '13px', color: '#555' }}>{lang === 'ar' ? 'كلية الهندسة - قسم هندسة المساحة' : 'Faculty of Engineering - Dept. of Surveying Engineering'}</div>
                            </div>
                        </div>
                        <div style={{ textAlign: lang === 'ar' ? 'left' : 'right' }}>
                            <div style={{ fontWeight: 900, fontSize: '14px', color: '#F58220' }}>GESS EDU</div>
                            <div style={{ fontSize: '11px', color: '#888' }}>{new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US')}</div>
                        </div>
                    </div>

                    <h1 style={{ textAlign: 'center', fontSize: '22px', fontWeight: 900, marginBottom: '4px' }}>
                        {lang === 'ar' ? 'ملف بيانات الطالب' : 'Student Data File'}
                    </h1>
                    <p style={{ textAlign: 'center', fontSize: '12px', color: '#888', marginBottom: '28px' }}>
                        {lang === 'ar' ? 'صادر إلكترونيًا من منصة GESS EDU' : 'Issued electronically by GESS EDU platform'}
                    </p>

                    {/* بطاقة الطالب */}
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '18px', background: '#FFF4E9', borderRadius: '20px', padding: '20px', marginBottom: '24px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '18px' }}>
                            <div style={{ width: '70px', height: '70px', borderRadius: '18px', background: 'linear-gradient(135deg,#F58220,#ff5b3d)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 900, fontSize: '26px', flexShrink: 0 }}>
                                {(student.fullName || '?').trim().charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div style={{ fontWeight: 900, fontSize: '19px' }}>{student.fullName || '-'}</div>
                                <div style={{ fontSize: '13px', color: '#555', fontWeight: 700 }} dir="ltr">{student.email}</div>
                            </div>
                        </div>
                        <div style={{ textAlign: 'center', background: 'linear-gradient(135deg,#F58220,#ff5b3d)', borderRadius: '16px', padding: '10px 18px', flexShrink: 0 }}>
                            <div style={{ color: '#fff', fontWeight: 900, fontSize: '20px', lineHeight: 1 }}>{batchLabelForYear(student.year)}</div>
                            <div style={{ color: 'rgba(255,255,255,0.85)', fontWeight: 700, fontSize: '9px', marginTop: '3px' }}>{lang === 'ar' ? 'الدفعة' : 'BATCH'}</div>
                        </div>
                    </div>

                    {/* جدول البيانات */}
                    <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '28px' }}>
                        <tbody>
                            {rows.map(([label, value], idx) => (
                                <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                                    <td style={{ padding: '10px 6px', fontWeight: 800, color: '#888', fontSize: '13px', width: '40%' }}>{label}</td>
                                    <td style={{ padding: '10px 6px', fontWeight: 700, fontSize: '14px' }}>{value}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

                    {student.bio && (
                        <div style={{ marginBottom: '28px' }}>
                            <div style={{ fontWeight: 900, fontSize: '13px', color: '#888', marginBottom: '6px' }}>{lang === 'ar' ? 'نبذة' : 'About'}</div>
                            <div style={{ fontSize: '13px', lineHeight: 1.7, background: '#FAFAFA', borderRadius: '14px', padding: '14px' }}>{student.bio}</div>
                        </div>
                    )}

                    {/* المسار الأكاديمي */}
                    <div style={{ marginBottom: '36px' }}>
                        <div style={{ fontWeight: 900, fontSize: '13px', color: '#888', marginBottom: '12px' }}>{lang === 'ar' ? 'المسار الأكاديمي' : 'Academic Path'}</div>
                        <div style={{ display: 'flex', alignItems: 'center' }}>
                            {yearLabels.map((label, idx) => {
                                const stepYear = String(idx + 1);
                                const isDone = Number(stepYear) < Number(student.year || 1);
                                const isCurrent = stepYear === String(student.year || 1);
                                return (
                                    <React.Fragment key={idx}>
                                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px' }}>
                                            <div style={{
                                                width: '26px', height: '26px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                fontSize: '11px', fontWeight: 900, color: isCurrent || isDone ? '#fff' : '#999',
                                                background: isCurrent ? '#F58220' : isDone ? '#ffab5e' : '#eee'
                                            }}>{idx + 1}</div>
                                            <span style={{ fontSize: '9px', fontWeight: 700, color: isCurrent ? '#F58220' : '#999' }}>{label}</span>
                                        </div>
                                        {idx < yearLabels.length - 1 && (
                                            <div style={{ flex: 1, height: '3px', background: Number(stepYear) < Number(student.year || 1) ? '#F58220' : '#eee', margin: '0 4px', marginBottom: '14px' }}></div>
                                        )}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    </div>

                    {/* تذييل: توقيع وختم */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '50px', paddingTop: '20px', borderTop: '1px solid #eee' }}>
                        <div style={{ textAlign: 'center', width: '180px' }}>
                            <div style={{ borderBottom: '1px solid #999', marginBottom: '6px', height: '40px' }}></div>
                            <div style={{ fontSize: '11px', fontWeight: 700, color: '#888' }}>{lang === 'ar' ? 'توقيع مسؤول القسم' : "Department Officer's Signature"}</div>
                        </div>
                        <div style={{ textAlign: 'center', width: '180px' }}>
                            <div style={{ borderBottom: '1px solid #999', marginBottom: '6px', height: '40px' }}></div>
                            <div style={{ fontSize: '11px', fontWeight: 700, color: '#888' }}>{lang === 'ar' ? 'الختم الرسمي' : 'Official Seal'}</div>
                        </div>
                    </div>
                    <p style={{ textAlign: 'center', fontSize: '10px', color: '#bbb', marginTop: '20px' }}>
                        {lang === 'ar' ? 'هذا الملف صادر إلكترونيًا ولا يحتاج توقيعًا لاستخدامه داخل منصة GESS EDU' : 'This file is issued electronically and needs no signature for internal GESS EDU use'}
                    </p>
                </div>
            );
        }

        // ============================================================
        // نافذة تفاصيل الطالب (تظهر عند الضغط على صف في الجدول)
        // ============================================================
        // ============================================================
        // كشف الطلاب الكامل القابل للطباعة/الحفظ كـ PDF
        // ============================================================
        function StudentsTablePrintFile({ students, lang, yearFilter }) {
            const isFilteredByYear = yearFilter && yearFilter !== 'all';
            const batchLabel = isFilteredByYear ? batchLabelForYear(yearFilter) : null;
            return (
                <div dir={lang === 'ar' ? 'rtl' : 'ltr'} style={{ fontFamily: 'Tajawal, sans-serif', color: '#1a1a1a', padding: '10mm' }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '4px solid #F58220', paddingBottom: '14px', marginBottom: '20px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                            <img src={GESS_LOGO} alt="GESS" style={{ width: '48px', height: '48px', borderRadius: '12px', objectFit: 'contain', background: '#fff', border: '1px solid #eee' }} />
                            <div>
                                <div style={{ fontWeight: 900, fontSize: '17px' }}>{lang === 'ar' ? 'جامعة الخرطوم - قسم هندسة المساحة' : 'University of Khartoum - Surveying Engineering'}</div>
                                <div style={{ fontWeight: 700, fontSize: '12px', color: '#888' }}>
                                    {isFilteredByYear
                                        ? (lang === 'ar' ? `كشف طلاب الدفعة ${batchLabel} (${students.length})` : `Batch ${batchLabel} Students List (${students.length})`)
                                        : (lang === 'ar' ? `كشف الطلاب المسجلين - كل الدفعات (${students.length})` : `Registered Students List - All Batches (${students.length})`)}
                                </div>
                            </div>
                        </div>
                        <div style={{ textAlign: lang === 'ar' ? 'left' : 'right', display: 'flex', alignItems: 'center', gap: '10px' }}>
                            {isFilteredByYear && (
                                <div style={{ background: 'linear-gradient(135deg,#F58220,#ff5b3d)', color: '#fff', fontWeight: 900, fontSize: '14px', padding: '8px 16px', borderRadius: '999px' }}>
                                    {lang === 'ar' ? `الدفعة ${batchLabel}` : `Batch ${batchLabel}`}
                                </div>
                            )}
                            <div>
                                <div style={{ fontWeight: 900, fontSize: '13px', color: '#F58220' }}>GESS EDU</div>
                                <div style={{ fontSize: '10px', color: '#999' }}>{new Date().toLocaleDateString(lang === 'ar' ? 'ar-EG' : 'en-US')}</div>
                            </div>
                        </div>
                    </div>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '10px', tableLayout: 'fixed' }}>
                        <colgroup>
                            <col style={{ width: '4%' }} />
                            <col style={{ width: '16%' }} />
                            <col style={{ width: '20%' }} />
                            <col style={{ width: '11%' }} />
                            <col style={{ width: '10%' }} />
                            <col style={{ width: '17%' }} />
                            <col style={{ width: '13%' }} />
                            <col style={{ width: '9%' }} />
                        </colgroup>
                        <thead>
                            <tr style={{ background: '#FFF4E9' }}>
                                {[
                                    '#',
                                    lang === 'ar' ? 'الاسم' : 'Name',
                                    lang === 'ar' ? 'البريد الإلكتروني' : 'Email',
                                    lang === 'ar' ? 'الرقم الجامعي' : 'ID',
                                    lang === 'ar' ? 'السنة / الدفعة' : 'Year / Batch',
                                    lang === 'ar' ? 'التخصص' : 'Specialization',
                                    lang === 'ar' ? 'الهاتف' : 'Phone',
                                    lang === 'ar' ? 'الحالة' : 'Status',
                                ].map((h, i) => (
                                    <th key={i} style={{ padding: '8px 5px', textAlign: lang === 'ar' ? 'right' : 'left', fontWeight: 900, borderBottom: '2px solid #F58220', overflowWrap: 'break-word' }}>{h}</th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {students.map((s, idx) => (
                                <tr key={s.id} style={{ borderBottom: '1px solid #eee' }}>
                                    <td style={{ padding: '6px 5px', color: '#999', verticalAlign: 'top' }}>{idx + 1}</td>
                                    <td style={{ padding: '6px 5px', fontWeight: 800, verticalAlign: 'top', overflowWrap: 'break-word' }}>{s.fullName || '-'}</td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top', overflowWrap: 'anywhere' }} dir="ltr">{s.email}</td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top', overflowWrap: 'break-word' }} dir="ltr">{s.studentId || '-'}</td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top' }}>
                                        {yearLabelText(s.year, lang)}
                                        <span style={{ color: '#F58220', fontWeight: 800 }}> · {batchLabelForYear(s.year)}</span>
                                    </td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top', overflowWrap: 'break-word' }}>{s.specialization || '-'}</td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top', overflowWrap: 'anywhere' }} dir="ltr">{s.phone || '-'}</td>
                                    <td style={{ padding: '6px 5px', verticalAlign: 'top' }}>{(s.status || 'active') === 'suspended' ? (lang === 'ar' ? 'موقوف' : 'Suspended') : (lang === 'ar' ? 'نشط' : 'Active')}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <p style={{ textAlign: 'center', fontSize: '10px', color: '#bbb', marginTop: '24px' }}>
                        {lang === 'ar' ? `تم إنشاء هذا الكشف بتاريخ ${new Date().toLocaleDateString('ar-EG')} عبر منصة GESS EDU` : `Generated on ${new Date().toLocaleDateString('en-US')} via GESS EDU`}
                    </p>
                </div>
            );
        }

        // ============================================================
        // معاينة الطباعة: بتوريك شكل المستند فعليًا فوق الشاشة قبل ما تطبع،
        // وانت اللي بتتحكم متى تطبع بالظبط (بدل الطباعة التلقائية غير المضمونة)
        // ============================================================
        function PrintPreviewModal({ lang, darkMode, title, onClose, children }) {
            return (
                <div className="fixed inset-0 z-[280] flex items-center justify-center p-4 no-print">
                    <div className="absolute inset-0 bg-black/70 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}></div>
                    <div className={`relative w-full max-w-3xl rounded-[2rem] shadow-2xl overflow-hidden animate-in zoom-in-95 fade-in duration-200 max-h-[92vh] flex flex-col ${darkMode ? 'bg-gray-900' : 'bg-white'}`}>

                        <div className={`flex items-center justify-between px-6 py-4 border-b shrink-0 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                            <div className="flex items-center gap-2">
                                <i data-lucide="printer" className="w-5 h-5 text-[#f58220]"></i>
                                <h3 className={`font-black ${darkMode ? 'text-white' : 'text-gray-800'}`}>{title}</h3>
                            </div>
                            <button onClick={onClose} className={`p-2 rounded-full transition-colors ${darkMode ? 'hover:bg-gray-800 text-gray-400' : 'hover:bg-gray-100 text-gray-500'}`}>
                                <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                        </div>

                        {/* معاينة "الورقة" زي ما هتطلع بالظبط */}
                        <div className={`flex-1 overflow-y-auto p-6 ${darkMode ? 'bg-gray-950' : 'bg-gray-100'}`}>
                            <div className="bg-white rounded-lg shadow-xl mx-auto" style={{ maxWidth: '210mm', minHeight: '100px' }}>
                                {children}
                            </div>
                        </div>

                        <div className={`flex gap-3 px-6 py-4 border-t shrink-0 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                            <button
                                onClick={onClose}
                                className={`flex-1 p-3 rounded-xl font-black text-sm transition-colors ${darkMode ? 'bg-gray-800 text-gray-300 hover:bg-gray-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                            >
                                {lang === 'ar' ? 'إلغاء' : 'Cancel'}
                            </button>
                            <button
                                onClick={() => window.print()}
                                className="flex-1 p-3 rounded-xl font-black text-sm bg-[#f58220] text-white hover:bg-[#dd6e10] transition-colors flex items-center justify-center gap-2 shadow-lg shadow-orange-900/20"
                            >
                                <i data-lucide="printer" className="w-4 h-4"></i>
                                {lang === 'ar' ? 'طباعة / حفظ PDF' : 'Print / Save as PDF'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function StudentDetailModal({ student, lang, darkMode, isSuperAdmin, currentUid, onClose, onPrint, onToggleStatus, onToggleRole, onDelete }) {
            if (!student) return null;
            const isAdminRole = student.role === 'admin';
            const isSelf = currentUid && currentUid === student.id;
            return (
                <div className="fixed inset-0 z-[250] flex items-center justify-center p-4 no-print">
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm animate-in fade-in duration-200" onClick={onClose}></div>
                    <div className={`relative w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 fade-in duration-200 max-h-[90vh] flex flex-col ${darkMode ? 'bg-gray-900' : 'bg-white'}`}>
                        <div className="bg-gradient-to-br from-[#f58220] to-[#ff5b3d] p-6 text-white relative shrink-0">
                            <button onClick={onClose} className="absolute top-4 left-4 p-2 bg-white/20 hover:bg-white/30 rounded-full transition-colors">
                                <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                            <div className="flex items-center gap-4">
                                <div className="w-16 h-16 rounded-2xl bg-white/20 border-2 border-white/40 flex items-center justify-center text-2xl font-black shrink-0">
                                    {(student.fullName || '?').trim().charAt(0).toUpperCase()}
                                </div>
                                <div className="min-w-0">
                                    <div className="flex items-center gap-2">
                                        <h2 className="text-xl font-black truncate">{student.fullName || '-'}</h2>
                                        {isAdminRole && (
                                            <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-white/25 flex items-center gap-1 shrink-0">
                                                <i data-lucide="shield-check" className="w-3 h-3"></i>
                                                {lang === 'ar' ? 'أدمن' : 'Admin'}
                                            </span>
                                        )}
                                    </div>
                                    <p className="text-white/80 text-sm font-medium truncate" dir="ltr">{student.email}</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 space-y-3 overflow-y-auto">
                            {[
                                [lang === 'ar' ? 'الرقم الجامعي' : 'Student ID', student.studentId || '-', 'hash'],
                                [lang === 'ar' ? 'السنة الدراسية' : 'Academic Year', lang === 'ar' ? `السنة ${yearLabelText(student.year, lang)}` : `Year ${student.year || '-'}`, 'graduation-cap'],
                                [lang === 'ar' ? 'الدفعة' : 'Batch', batchLabelForYear(student.year), 'users'],
                                [lang === 'ar' ? 'التخصص' : 'Specialization', student.specialization || '-', 'compass'],
                                [lang === 'ar' ? 'رقم الهاتف' : 'Phone', student.phone || '-', 'phone'],
                                [lang === 'ar' ? 'تاريخ التسجيل' : 'Registered On', formatStudentDate(student.createdAt, lang), 'calendar'],
                            ].map(([label, value, icon], idx) => (
                                <div key={idx} className={`flex items-center gap-3 p-3 rounded-xl ${darkMode ? 'bg-gray-800' : 'bg-gray-50'}`}>
                                    <i data-lucide={icon} className="w-4 h-4 text-[#f58220] shrink-0"></i>
                                    <span className="text-xs font-bold text-gray-400 w-28 shrink-0">{label}</span>
                                    <span className={`text-sm font-black truncate ${darkMode ? 'text-white' : 'text-gray-800'}`} dir={icon === 'phone' ? 'ltr' : undefined}>{value}</span>
                                </div>
                            ))}
                            {student.bio && (
                                <div className={`p-3 rounded-xl ${darkMode ? 'bg-gray-800' : 'bg-gray-50'}`}>
                                    <span className="text-xs font-bold text-gray-400 block mb-1">{lang === 'ar' ? 'نبذة' : 'About'}</span>
                                    <p className={`text-sm font-medium ${darkMode ? 'text-gray-200' : 'text-gray-700'}`}>{student.bio}</p>
                                </div>
                            )}

                            {/* التحكم في صلاحية الأدمن - للسوبر أدمن فقط */}
                            {isSuperAdmin && (
                                <div className={`p-4 rounded-xl border-2 border-dashed ${darkMode ? 'border-orange-900/40 bg-orange-900/10' : 'border-orange-200 bg-orange-50/50'}`}>
                                    <div className="flex items-center gap-2 mb-2">
                                        <i data-lucide="crown" className="w-4 h-4 text-[#f58220]"></i>
                                        <span className={`text-xs font-black ${darkMode ? 'text-white' : 'text-gray-800'}`}>{lang === 'ar' ? 'صلاحيات الأدمن (سوبر أدمن فقط)' : 'Admin Privileges (Super Admin only)'}</span>
                                    </div>
                                    {isSelf ? (
                                        <p className="text-[11px] text-gray-400 font-bold">{lang === 'ar' ? 'ما تقدرش تعدّل صلاحيتك انت نفسك من هنا' : "You can't change your own role from here"}</p>
                                    ) : (
                                        <button
                                            onClick={() => onToggleRole(student)}
                                            className={`w-full p-2.5 rounded-lg font-black text-xs transition-colors ${
                                                isAdminRole
                                                    ? 'bg-red-50 text-red-500 hover:bg-red-500 hover:text-white'
                                                    : 'bg-[#f58220] text-white hover:bg-[#dd6e10]'
                                            }`}
                                        >
                                            {isAdminRole
                                                ? (lang === 'ar' ? 'سحب صلاحية الأدمن' : 'Revoke Admin Access')
                                                : (lang === 'ar' ? '+ منح صلاحية أدمن' : '+ Grant Admin Access')}
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="p-4 border-t flex flex-col gap-2 shrink-0" style={{ borderColor: darkMode ? '#374151' : '#f0f0f0' }}>
                            <div className="flex gap-2">
                                <button
                                    onClick={() => onToggleStatus(student)}
                                    className={`flex-1 p-3 rounded-xl font-black text-sm transition-colors ${
                                        (student.status || 'active') === 'suspended'
                                            ? 'bg-green-50 text-green-600 hover:bg-green-600 hover:text-white'
                                            : 'bg-red-50 text-red-500 hover:bg-red-500 hover:text-white'
                                    }`}
                                >
                                    {(student.status || 'active') === 'suspended' ? (lang === 'ar' ? 'تفعيل الحساب' : 'Activate') : (lang === 'ar' ? 'إيقاف الحساب' : 'Suspend')}
                                </button>
                                <button
                                    onClick={() => onPrint(student)}
                                    className="flex-1 p-3 rounded-xl font-black text-sm bg-[#f58220] text-white hover:bg-[#dd6e10] transition-colors flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="printer" className="w-4 h-4"></i>
                                    {lang === 'ar' ? 'طباعة ملف الطالب' : 'Print Student File'}
                                </button>
                            </div>
                            {isSuperAdmin && !isSelf && (
                                <button
                                    onClick={() => onDelete(student)}
                                    className="w-full p-2.5 rounded-xl font-bold text-xs bg-transparent text-red-500 hover:bg-red-50 transition-colors flex items-center justify-center gap-1.5 border border-red-200"
                                >
                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
