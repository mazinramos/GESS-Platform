                            <div className={`animate-in transition-colors ${darkMode ? 'text-white' : 'text-gray-900'}`}>
                                {(path.length > 0 || selectedItem) && (
                                    <button onClick={() => selectedItem ? setSelectedItem(null) : setPath(path.slice(0, -1))} className="mb-8 flex items-center gap-2 text-[#f58220] font-black bg-white px-6 py-3 rounded-2xl shadow-sm border border-gray-50">
                                       <i data-lucide="chevron-left" className="rotate-180"></i>{lang === 'ar' ? "رجوع" : "Back"}
                                    </button>
                                )}

                                {path.length === 0 && !selectedItem && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <>
                                        {years.map(y => (
                                           <button key={y.id} onClick={() => setPath([{type: 'year', ...y}])} className={`p-8 rounded-[2.5rem] border transition-all duration-300 flex flex-col items-center group ${darkMode ? 'bg-gray-800 border-gray-700 shadow-2xl' : 'bg-white border-gray-100 shadow-sm hover:shadow-md'}`}>
                                                <i data-lucide="graduation-cap" class="w-12 h-12 text-[#f58220] mb-4"></i>
                                               <h3 className={`text-2xl font-black transition-colors ${darkMode ? 'text-white' : 'text-gray-800'}`}>{y.title}</h3>
                                                <p className="text-gray-400 text-sm mt-2">{lang === 'ar' ? "عرض المواد الدراسية" : "View Academic Subjects"}</p>
                                            </button>
                                        ))}
                                            <button 
                                                onClick={() => setPath([{ id: 'courses', title: lang === 'ar' ? 'الكورسات التدريبية' : 'Training Courses', type: 'courses_section' }])}
                                                className={`p-8 rounded-2xl cursor-pointer shadow-lg transform transition hover:scale-105 text-center flex flex-col items-center justify-center bg-gradient-to-br from-orange-500 to-red-600 text-white`}>
                                                <i data-lucide="rocket" class="w-12 h-12 mb-4"></i>
                                                <h3 className="text-2xl font-black">{lang === 'ar' ? "الكورسات التدريبية" : "Training Courses"}</h3>
                                                <p className="text-white/80 text-sm mt-2">{lang === 'ar' ? "تطوير المهارات والبرامج الخارجية" : "Skills Development & External Programs"}</p>
                                            </button>
                                        </>
                                    </div>
                                    
                                )}

                                {path.length === 1 && path[0].type === 'year' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                                        {semesters.map(s => (
                                            <button key={s.id} onClick={() => setPath([...path, {type: 'semester', ...s}])} className={`p-8 rounded-[2.5rem] border transition-all duration-300 flex flex-col items-center group ${darkMode ? 'bg-gray-800 border-gray-700 shadow-2xl' : 'bg-white border-gray-100 shadow-sm hover:shadow-md'}`}>
                                                <i data-lucide="book-open" class="w-16 h-16 text-[#f58220] mx-auto mb-4"></i>
                                                <h3 className={`text-3xl font-black transition-colors ${darkMode ? 'text-white' : 'text-gray-800'}`}>{s.title}</h3>
                                            </button>
                                        ))}
                                    </div>
                                )}

{path.length === 1 && path[0].id === 'courses' && (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-in fade-in duration-500">

        {[...new Set(contents.filter(c => c.category === 'special_course').map(c => c.courseName))].map(courseName => (
            <button 
                key={courseName}
                onClick={() => setPath([...path, { id: courseName, title: courseName, type: 'inside_course' }])}
                className="p-8 rounded-2xl bg-white dark:bg-gray-800 shadow-xl hover:scale-105 transition text-center border-2 border-orange-500"
            >
                <i data-lucide="book" class="w-12 h-12 mb-4 text-orange-500"></i>
                <h3 className="text-2xl font-bold">{courseName}</h3>
                <p>{lang === 'ar' ? "اضغط لعرض المحتويات" : "Click to view contents"}</p>
            </button>
        ))}
        
        {contents.filter(c => c.category === 'special_course').length === 0 && (
            <div className="col-span-full text-center p-10 opacity-50">
               <p>{lang === 'ar' ? "..لا توجد كورسات مضافة حالياً" : "No courses added yet.."}</p>
            </div>
        )}
    </div>
)}

                                {path.length === 2 && (
    <div className="grid grid-cols-2 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
        {/* كرت الفيديوهات */}
        <button onClick={() => setView('videos')} className="p-6 rounded-xl bg-blue-50 dark:bg-blue-900/20 flex flex-col items-center shadow-sm border border-blue-100">
            <i data-lucide="video" class="w-10 h-10 mb-2 text-blue-600"></i>
            <span className="font-bold">{lang === 'ar' ? "فيديوهات" : "Videos"}</span>
        </button>

        {/* كرت الملفات */}
        <button onClick={() => setView('pdfs')} className="p-6 rounded-xl bg-red-50 dark:bg-red-900/20 flex flex-col items-center shadow-sm border border-red-100">
            <i data-lucide="file-text" class="w-10 h-10 mb-2 text-red-600"></i>
            <span className="font-bold">{lang === 'ar' ? "ملفات PDF" : "PDF Files"}</span>
        </button>

        {/* كرت الامتحانات */}
        <button onClick={() => setView('exams')} className="p-6 rounded-xl bg-green-50 dark:bg-green-900/20 flex flex-col items-center shadow-sm border border-green-100">
            <i data-lucide="clipboard-list" class="w-10 h-10 mb-2 text-green-600"></i>
            <span className="font-bold">{lang === 'ar' ? "امتحانات" : "Exams"}</span>
        </button>

        {/* كرت المراجع */}
        <button onClick={() => setView('refs')} className="p-6 rounded-xl bg-purple-50 dark:bg-purple-900/20 flex flex-col items-center shadow-sm border border-purple-100">
            <i data-lucide="external-link" class="w-10 h-10 mb-2 text-purple-600"></i>
           <span className="font-bold">{lang === 'ar' ? "المراجع" : "References"}</span>
        </button>
    </div>
)}

                                {path.length === 3 && !selectedItem && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                        {contents.filter(c => c.yearId === path[0].id && c.semesterId === path[1].id && c.subject === path[2].title).map(item => (
                                            <button key={item.id} onClick={() => setSelectedItem(item)} className="bg-white p-6 rounded-[2rem] border flex items-center justify-between hover:shadow-lg transition-all text-right">
                                                <div className="flex items-center gap-4">
                                                    <div className={`p-4 rounded-xl ${item.type === 'video' ? 'bg-red-50 text-red-500' : 'bg-indigo-50 text-indigo-500'}`}>
                                                        {item.type === 'video' ? <i data-lucide="video"></i> : <i data-lucide="file-text"></i>}
                                                    </div>
                                                    <div>
                                                        <h4 className="font-black text-lg">{item.title}</h4>
                                                        <p className="text-[10px] font-bold text-gray-400 italic uppercase">{item.type}</p>
                                                    </div>
                                                </div>
                                                <i data-lucide="chevron-left" class="text-gray-300"></i>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {selectedItem && (
                                    <div className="bg-white rounded-[3rem] shadow-2xl overflow-hidden animate-in">
                                        <div className="p-4 bg-gray-50 flex items-center justify-between">
                                            <span className="text-xs font-black text-gray-500">{selectedItem.subject}</span>
                                            <button onClick={() => setSelectedItem(null)} className="p-2 bg-white rounded-full"><i data-lucide="x"></i></button>
                                        </div>
                                        {selectedItem.type === 'video' ? (
                                            <div className="aspect-video bg-black">
                                                <iframe src={selectedItem.url.replace("watch?v=", "embed/")} className="w-full h-full border-none" allowFullScreen></iframe>
                                            </div>
                                        ) : (
                                            <div className="py-20 text-center bg-gradient-to-br from-[#f58220]/5 to-transparent">
                                                <i data-lucide="file-text" class="w-20 h-20 text-[#f58220]/20 mx-auto mb-6"></i>
                                                <h3 className="text-2xl font-black mb-10">{selectedItem.title}</h3>
                                                <a href={selectedItem.url} target="_blank" className="bg-[#f58220] text-white px-10 py-4 rounded-full font-black shadow-xl">تحميل / فتح الملف</a>
                                            </div>
                                        )}
                                        <div className="p-10">
                                            <h2 className="text-3xl font-black text-gray-900">{selectedItem.title}</h2>
                                            <p className="mt-4 text-gray-500 font-medium">{lang === 'ar' ? "المحتوى بواسطة قسم هندسة المساحة لخدمة الطلاب أكاديمياً" : "Content provided by the Geomatics Engineering Department for academic student support"}</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <footer className="fixed bottom-0 left-0 right-0 h-10 bg-white/50 backdrop-blur-md border-t flex items-center justify-center">
                        <p className="text-[10px] font-black text-gray-400">GESS • UNIVERSITY OF KHARTOUM • GEOMATICS ENGINEERING</p>
                    </footer>
                    {toast.show && (
  <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] animate-bounce">
    <div className="bg-gray-800 text-white px-6 py-3 rounded-2xl shadow-2xl border border-gray-700 flex items-center gap-3">
      <div className="w-2 h-2 rounded-full bg-[#f58220]"></div>
      <span className="font-bold text-sm">{toast.message}</span>
    </div>
  </div>
)}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
